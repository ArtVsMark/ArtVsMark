<svg width="1280" height="340" viewBox="0 0 1280 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Artem Markitanov — Python grading, benchmarking, testing and CI automation">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D1117"/><stop offset="100%" stop-color="#161B22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58A6FF"/><stop offset="50%" stop-color="#7EE787"/><stop offset="100%" stop-color="#D2A8FF"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#21262D" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.82" cy="0.2" r="0.7">
      <stop offset="0%" stop-color="#58A6FF" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#58A6FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="repl" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#58A6FF"/><stop offset="55%" stop-color="#7EE787"/><stop offset="100%" stop-color="#D2A8FF"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="340" rx="20" fill="url(#bg)"/>
  <rect width="1280" height="340" rx="20" fill="url(#grid)" opacity="0.6"/>
  <rect width="1280" height="340" rx="20" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1279" height="339" rx="20" fill="none" stroke="#30363D"/>
  <rect x="0" y="0" width="6" height="340" rx="3" fill="url(#accent)"/>

  <text x="72" y="128" fill="#F0F6FC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="52" font-weight="800" letter-spacing="-0.5">Artem Markitanov</text>
  <rect x="72" y="150" width="96" height="4" rx="2" fill="url(#accent)"/>
  <text x="72" y="196" fill="#C9D1D9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="600">Open-source Python maintainer</text>
  <text x="72" y="226" fill="#7D8590" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="500">Grading · benchmarking · testing · CI automation</text>
  <rect x="72" y="250" width="76" height="30" rx="15" fill="#161B22" stroke="#30363D"/><text x="110" y="270" fill="#8B949E" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="600" text-anchor="middle">Python</text><rect x="158" y="250" width="76" height="30" rx="15" fill="#161B22" stroke="#30363D"/><text x="196" y="270" fill="#8B949E" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="600" text-anchor="middle">pytest</text><rect x="244" y="250" width="67" height="30" rx="15" fill="#161B22" stroke="#30363D"/><text x="278" y="270" fill="#8B949E" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="600" text-anchor="middle">CI/CD</text><rect x="321" y="250" width="130" height="30" rx="15" fill="#161B22" stroke="#30363D"/><text x="386" y="270" fill="#8B949E" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="600" text-anchor="middle">benchmarking</text><rect x="461" y="250" width="112" height="30" rx="15" fill="#161B22" stroke="#30363D"/><text x="517" y="270" fill="#8B949E" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="600" text-anchor="middle">sandboxing</text>

  <g opacity="0.9">
    <rect x="880.5" y="72.5" width="329" height="195" rx="14" fill="#0D1117" stroke="#30363D"/>
    <text x="1045" y="184" fill="url(#repl)" font-family="SFMono-Regular,Consolas,Liberation Mono,Menlo,monospace" font-size="78" font-weight="700" text-anchor="middle" letter-spacing="-2">&gt;&gt;&gt;</text>
    <rect x="998" y="204" width="94" height="6" rx="3" fill="#30363D"/>
    <text x="1045" y="236" fill="#7D8590" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" text-anchor="middle" letter-spacing="1.4">PYTHON</text>
