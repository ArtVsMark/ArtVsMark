# Планка версии языка — единственное место, где записано число (#269, 217).
#
# Пакета здесь нет и не будет: витрина — скрипты сборки и гейтов, а не
# библиотека. Файл существует ради одной строки ниже. Из неё выводятся
# остальные: `setup-python` в каждом прогоне сверяет с ней гейт каталога
# `check_python_version.py`, а цель стиля для ruff — `check_py_style.py`
# (оба вызываются из pr-check.yml по закреплённой версии каталога). Поднять
# планку — поменять число здесь; прогоны, вписавшие другое, покраснеют сами.
[project]
name = "artvsmark-profile"
version = "0"
requires-python = ">=3.14"
