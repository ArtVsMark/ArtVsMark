# Двигает пины actions.
#
# Действия в обоих workflow запиннуты по SHA, а не по тегу: тег переставляют,
# и «v7.0.1» завтра может означать другой код. Плата за это — пин не обновится
# сам никогда: полгода спустя витрина будет собираться уязвимой версией, и
# узнать об этом будет неоткуда.
#
# Dependabot закрывает ровно эту дыру: он умеет обновлять SHA-пины и
# переписывает комментарий с версией рядом с ними. Раз в неделю, одним PR на
# все экшены — витрина слишком мала, чтобы дробить.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"
