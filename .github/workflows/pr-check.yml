# Проверка PR витрины.
#
# Зачем она вообще: у витрины нет тестов, и до сих пор на PR не запускалось
# ничего. «Слить по зелёному» в таком репозитории означает «слить сразу» —
# автомержу нечего ждать. Проверять при этом есть что: жив ли каждый источник
# метрики, на месте ли маркеры чисел, проставился ли alt у всех картинок, не
# перерос ли «Current focus» свой потолок.
#
# Прогон ничего не пишет: `--check` собирает страницу в память и сверяет
# инварианты. Расхождение чисел с тем, что лежит в ветке, дефектом НЕ считается
# — числа переписывает суточная сборка, и требовать их свежести на PR значило бы
# ронять проверку от чужого коммита.
name: PR check

on:
  pull_request:
    branches: [main]
    # `labeled`/`unlabeled` — чтобы проверка классификации пересчитывалась,
    # когда метку наконец поставили, а не висела красной до следующего пуша.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: read

# ОДНА ГОЛОВА — ОДНА ЖИВАЯ ЗАПИСЬ, И ЭТО ОПЛАЧЕНО СЛИЯНИЕМ КРАСНОГО.
# Здесь стояла отдельная группа для событий метки конвейера: они отменяли
# только такие же, а настоящая проверка досчитывалась. Вместе с пропуском по
# `if` это давало на одной голове НЕСКОЛЬКО записей с именем обязательной
# проверки — и 7 сентября изменение #140 слилось при КРАСНОЙ: рядом с
# `failure` лежала `skipped` от события метки, и защита ветки сочла требование
# выполненным. Красное завершилось в 09:30:32, слияние прошло в 09:52:14.
#
# Обязательная проверка, которую можно обойти нейтральной записью, обязательна
# только на вид. Поэтому: пропуска по `if` больше нет — прогон от метки бежит
# честно, — и группа у всех событий одна, так что предыдущий прогон на той же
# голове отменяется. Отменённая запись успехом не считается и слияние держит.
#
# Цена названа: на снятие `hold` уходит лишний полный прогон. Это дороже
# пропуска на минуту машинного времени и дешевле слияния непроверенного.
#
# ГОЛОВА В ИМЕНИ ГРУППЫ — НЕ УТОЧНЕНИЕ, А УСЛОВИЕ ВЫХОДА ИЗ ТУПИКА (правило 179).
# Номер изменения за его жизнь не меняется, коммит меняется, а «новее» определено
# только для коммитов. Группа без головы знает о поколении прогона лишь время
# доставки события — которое площадка не упорядочивает. У соседа за 35 секунд
# пришли четыре события, `labeled` доставлено после `synchronize` и принесло уже
# устаревшую голову: прогон на актуальной был отменён прогоном на старой.
# Обязательной проверки на актуальном коммите после этого нет, и создать её
# нечем — прогон рождается только от события, а событий больше не будет.
# Расклинивается руками.
#
# Отмена остаётся включённой: дубли на ОДНОЙ голове гасить по-прежнему нужно.
concurrency:
  group: >-
    pr-check-${{ github.event.pull_request.number || github.ref }}-${{
      github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  check:
    # Имя работы задано явно, и это не оформление. В защите ветки обязательная
    # проверка называется по имени РАБОТЫ, а не прогона: правило, записанное как
    # «PR check» (имя прогона), не выполнилось бы никогда — площадка искала бы
    # проверку с таким именем, а на коммите лежала бы `check`, по идентификатору
    # работы. Пока имена расходились, слияние отбивалось с
    # «Required status check "PR check" is expected», и несливаемым становился
    # КАЖДЫЙ PR.
    name: PR check
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Забрать витрину
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Гейтам авторства нужна история и общая ветка: мелкого клона хватает
          # на сборку, но не на диапазон origin/main..HEAD.
          fetch-depth: 0

      # ЧЕКАУТА ГРЕЙДЕРА ЗДЕСЬ БОЛЬШЕ НЕТ — см. врезку в metrics.yml: числа,
      # ради которых он клонировался, грейдер публикует о себе сам.

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      # Самопроверки стоят ПЕРЕД сборкой: они не ходят в сеть и не требуют
      # клона, а падение гейта дороже узнать до того, как ему поверили. Форма
      # выбрана осознанно — флаг у каждого гейта, а не общий файл проверок:
      # проверка живёт рядом с предметом и умирает вместе с ним.
      # Помощник, общий для всех гейтов: свёртка имён и разметка находок
      # командой площадки. Его набор бежит первым — на нём стоят остальные, и
      # молчащая разметка спрятала бы причину у КАЖДОГО из них (правило 090).
      - name: Проверить общего помощника гейтов
        run: python scripts/checks.py --selftest

      - name: Проверить сторож метрик тем, что он обязан отвергнуть
        run: python scripts/build_metrics.py --selftest

      - name: Проверить гейт меток тем, что он обязан отвергнуть
        run: python scripts/check_labels.py --selftest

      # Разбор исходов у автомержа: он решает, красное здесь или предупреждение,
      # и ошибка в ту сторону запирает изменение в `unstable` (#65). Прогоняется
      # тем, что обязан отнести к каждому из трёх исходов, — настоящими ответами
      # площадки, а не пересказом.
      - name: Проверить разбор исходов тем, что он обязан отвергнуть
        run: python scripts/gh_outcome.py --selftest

      # Запреты витрины, которые можно проверить, теперь проверяются. Замер по
      # всем действующим вердиктам показал, что «держится чтением» — не
      # исключение, а норма: из 72 у 23 не бежало ничего. Правило, которое можно
      # сделать механическим, не оставляют в своде.
      - name: Проверить запреты витрины тем, что они обязаны отвергнуть
        run: python scripts/check_page.py --selftest

      - name: Запреты витрины соблюдены
        run: python scripts/check_page.py

      # Знак витрины лежит в дереве готовыми файлами, и его можно поправить
      # руками — правка потеряется при следующем запуске генератора, молча.
      # Поэтому сверка идёт на PR, а не при выпуске.
      - name: Проверить сверку знака тем, что она обязана отвергнуть
        run: python scripts/build_logo.py --selftest

      - name: Знак витрины совпадает с генератором
        run: python scripts/build_logo.py --check

      # Механизмы держат объявленное: три исхода у каждого скрипта, названная
      # причина у каждого вердикта без механизма, отсутствие циклов опроса,
      # обращения к площадке через один вход. Четыре правила одним предметом:
      # объявленное сверяется с сделанным.
      - name: Проверить сверку объявленного тем, что она обязана отвергнуть
        run: python scripts/check_mechanisms.py --selftest

      - name: Механизмы держат объявленное
        run: python scripts/check_mechanisms.py

      # Стоп-кран снимает механизм, и ошибка в решении сливает недоделанное.
      # Набор двусторонний: ложное снятие дороже ложного удержания — второе
      # всего лишь возвращает состояние, которое было до механизма.
      - name: Проверить решение о стоп-кране тем, что оно обязано удержать
        run: python scripts/hold.py --selftest

      # Журнал пополняется тем же заходом, что и правка (138). Замер, из-за
      # которого гейт завёлся: по 71 первопредку общей ветки 30 изменений
      # правили поведение, и 3 приехали без строки в журнале — одно из них
      # настоящее решение на 48 строк.
      - name: Проверить сверку журнала тем, что она обязана отвергнуть
        run: python scripts/check_journal.py --selftest

      # План окна (091) собирает хук старта, и прогона на изменении у него нет:
      # порядок источников держит набор — стрелка у первого НЕПУСТОГО, а не
      # у первого, и не ответивший трекер пустым не считается.
      - name: Проверить план окна тем, что он обязан показать
        run: python scripts/work_plan.py --selftest

      - name: Сторож толчка окна отвергает чужую и воскресшую ветки
        run: python scripts/push_guard.py --selftest

      # Фрагменты журнала изменений: имя несёт секцию, внутри одна строка.
      # Файл на изменение вместо строки в общем файле — два файла с разными
      # именами не конфликтуют никогда.
      - name: Проверить сборку фрагментов тем, что она обязана отвергнуть
        run: python scripts/collect_changelog.py --selftest

      - name: Фрагменты журнала изменений по формату
        run: python scripts/collect_changelog.py --check

      - name: Журнал в ногу с правкой
        run: python scripts/check_journal.py --pr="${{ github.event.pull_request.number }}"

      # Починка называет соседние случаи (195). Предмет оплачен здесь же:
      # #175 сузила чтение размера клетки и не назвала соседа рядом — признак
      # клетки читал класс по префиксу, и чужой class="caption" посчитался бы
      # столбцом сетки. Набор был зелёным, нашлось это только правилом (#178).
      - name: Проверить гейт соседей тем, что он обязан отвергнуть
        run: python scripts/check_neighbours.py --selftest

      - name: О соседях сказано
        run: python scripts/check_neighbours.py

      # Имя ветки называет задачу, а не окно. Проверяется ПОСЛЕ прочих гейтов
      # намеренно: чинится оно переименованием ветки, то есть дороже всего
      # остального, и краснеть первым ему незачем.
      - name: Проверить гейт имени ветки тем, что он обязан отвергнуть
        run: python scripts/check_branch.py --selftest

      - name: Имя ветки называет задачу
        # `head_ref` есть только у изменения; на ручном запуске берётся ветка
        # прогона. Пустого имени не бывает — гейт на него отвечает третьим
        # исходом, а не молчанием.
        run: python scripts/check_branch.py "${{ github.head_ref || github.ref_name }}"

      # Сторож свежести: второй рубеж против витрины, которая выглядит свежей,
      # будучи вчерашней. Набор гоняет подставное время — дожидаться настоящей
      # просрочки значило бы проверять механизм раз в двое суток.
      - name: Проверить сторож свежести тем, что он обязан отвергнуть
        run: python scripts/staleness.py --selftest

      # ДОГОВОР ФАКТОВ ЗДЕСЬ БОЛЬШЕ НЕ ПРОВЕРЯЕТСЯ: с 15.10 его держит каталог
      # (facts-v2.0.0, ArtVsMark/Engineering-Incidents-Playbook#843), и наборы
      # договора, его выпуска и манифеста семьи уехали вместе с ним (#353).
      # Витрина — читатель фактов: соседей она сверяет кодом каталога в
      # metrics.yml.

      # Третий сторож: изменение готово и не слито. Ложный отказ здесь дороже
      # пропуска — сторож, кричащий о нормальном слиянии, приучает не смотреть
      # на его задачу, — поэтому набор двусторонний и перебирает каждое условие.
      - name: Проверить сторож застрявших изменений тем, что он обязан отвергнуть
        run: python scripts/stuck_prs.py --selftest

      # Признак воскрешения бежит в agent-pr, где решается, открывать ли
      # изменение, — а его набор здесь: отказывать он обязан ИЗМЕНЕНИЮ, которое
      # признак правит, а не ждать следующего пуша (014, 202).
      - name: Проверить признак воскресшей ветки тем, что он обязан отвергнуть
        run: python scripts/resurrected.py --selftest

      # Переоформление правок dependabot бежит по расписанию, и его набор там
      # же, — но расписание не видит изменения, правящего сам механизм: сломанный
      # отбор или сообщение узнались бы только первым прогоном на живом боте.
      - name: Проверить переоформление правок бота тем, что оно обязано отобрать
        run: python scripts/reauthor_deps.py --selftest

      - name: Собрать витрину вхолостую
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build_metrics.py --check

      # Вердикт в bindings.json — утверждение о текущем коде, и устаревает оно
      # молча: count_rules переименовали в rules_export, и две ссылки полгода
      # показывали в пустоту. Гейт здесь, а не в сборке метрик: сборка
      # ДОПИСЫВАЕТ в этот файл новые правила и падать из-за чужого каталога не
      # должна, а проверка изменения — ровно то место, где смотрят на наш код.
      - name: Проверить, что вердикты показывают на живое
        run: python scripts/check_bindings.py

      # Зелёный прогон на хорошем входе подтверждает только то, что скрипт
      # запускается: проверка, всегда возвращающая ноль, проходит его идеально.
      # Поэтому через гейт прогоняется то, что он ОБЯЗАН отвергнуть, — правило
      # 140. Заодно и то, что он обязан пропустить: ложный отказ здесь дороже
      # пропуска, и первый черновик этой проверки отверг восемнадцать живых
      # ссылок из восемнадцати.
      - name: Проверить сам гейт тем, что он обязан отвергнуть
        run: python scripts/check_bindings.py --selftest

      # Таблица покрытия пластов в roles.md устарела бы к первому же новому
      # файлу: она не знает, что дерево изменилось. Сверка идёт в обе стороны —
      # файл без ведущего и пласт без предмета одинаково красные.
      - name: Проверить, что у каждого файла есть ведущий
        run: python scripts/check_roles.py

      - name: Проверить сам гейт ролей тем, что он обязан отвергнуть
        run: python scripts/check_roles.py --selftest

      # Источники истины (181): таблица свода собирается из .rules/sources.json,
      # и каждое исключительное утверждение свода объявлено там же. Свод читают
      # по частям, и два «единственных» адреса одного предмета по отдельности
      # верны — сверять их глазами нечем.
      - name: Проверить источники истины свода
        run: python scripts/check_sources.py

      - name: Проверить сам гейт источников тем, что он обязан отвергнуть
        run: python scripts/check_sources.py --selftest

      - name: Проверить классификацию
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/check_labels.py ${{ github.event.pull_request.number }}

      # Автор коммита держался памятью окна: контейнерное умолчание
      # «Claude <noreply@anthropic.com>» проставляется глобально при старте и
      # попадало в main пять раз. Соглашение без механизма не соблюдается.
      - name: Проверить, что подписи авторов не контейнерные
        run: python scripts/check_author.py

      - name: Проверить сам гейт подписей тем, что он обязан отвергнуть
        run: python scripts/check_author.py --selftest

      # Окно по следу сессии: срок жизни (006) и правка свода под живым окном
      # (047). Предупреждение, а не отказ — перезапуск решает владелец, а
      # красное, которое правкой изменения не чинится, учило бы его обходить
      # (051). Образец — проект механизмов, разбор #286.
      - name: Окно по следу сессии — срок и свежесть свода
        continue-on-error: true
        run: python scripts/check_window.py

      - name: Проверить разбор следа сессии тем, что он обязан найти
        run: python scripts/check_window.py --selftest

      # ТЕЛО ИЗМЕНЕНИЯ НЕСЁТ АТРИБУЦИЮ, И ЭТО ЗАВЕДЕНО ЗАРАНЕЕ. Пока площадка
      # склеивает сообщение слияния из коммитов ветки, тело на атрибуцию не
      # влияет — и ровно поэтому трейлеры в общей ветке ДВОЯТСЯ: по одному на
      # коммит плюс свой от площадки (у #129 их шесть). Лечится переключением
      # `squash_merge_commit_message` на `PR_BODY`; тогда сообщением коммита
      # становится тело изменения, а его окно переписывает руками.
      #
      # Гейт стоит ДО переключения, чтобы щёлкать было куда: первое же слияние
      # после него уехало бы без атрибуции и покрасило `attribution-history`
      # там, где прошлое уже не переписать (114).
      - name: Тело изменения несёт атрибуцию
        env:
          BODY: ${{ github.event.pull_request.body }}
          # Автор изменения, а не коммитов: описание пишет тот, кто открыл. У
          # dependabot хвостового блока в теле нет и дописать его некому (051).
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          # Автора мало: суточную пересборку открывает `agent-pr` токеном
          # ВЛАДЕЛЬЦА, а тело составляет прогон — следа сессии окна в нём нет и
          # быть не может. Ветка договаривает то, чего автор не знает.
          PR_BRANCH: ${{ github.head_ref }}
        run: |
          printf '%s\n' "$BODY" > "$RUNNER_TEMP/pr-body.md"
          python scripts/check_author.py --body-file="$RUNNER_TEMP/pr-body.md" \
            --author="$PR_AUTHOR" --branch="$PR_BRANCH"

      # Трейлеры — предмет каталога, а не наш: логика живёт там и подключается
      # ссылкой на версию. Своей копии не заводим (правило 090); подключение
      # закреплено по SHA, и почему — сказано в rules-inbox.yml.
      #
      # С выпуска каталога 1.3.0 гейт исполняется из того же закреплённого
      # каталога, что и обёртка: вход `catalogue-ref` больше не читается и снят.
      # Прежняя редакция выкачивала гейт по нему ещё раз, и закрепить его
      # можно было, только зная второй вход (095) — мы его знали и задавали.
      - name: Сверить трейлеры со списком согласованных имён
        uses: ArtVsMark/Engineering-Incidents-Playbook/.github/actions/attribution@cf7fc6f746dfca251a8b0686593ab42f34df050c # v2.0.0, 2026-10-16
        with:
          authors: .github/authors.txt
          # Пусто: подрезать нечего, диапазон и так только коммиты изменения.
          baseline: ""
          mode: branch

      # Чем правило держится у соседей — до того, как строить своё (162).
      # Шаг неблокирующий намеренно: «приём переносится» решает человек, стеки
      # разные, и отказ здесь означал бы «повтори за соседом» — ровно ту копию,
      # которую запрещает 090. Отказ сводки тоже не роняет изменение: чужой
      # источник не наша поломка.
      - name: Чем это держат соседи
        continue-on-error: true
        run: python scripts/neighbours.py

      - name: Проверить подсказку соседей тем, что она обязана отобрать
        run: python scripts/neighbours.py --selftest

      # ПЕРЕЕЗД НА ВЕРСИЮ ДЕРЖИТСЯ КОДОМ, А НЕ ЗЕЛЁНЫМ НАБОРОМ (217, #269).
      # Два гейта каталога — вызовом по закреплённой версии, а не копией
      # (090): check_python_version сверяет каждый setup-python с планкой
      # pyproject.toml и ловит работу, которая зовёт python раньше него;
      # check_py_style требует стиль планки — без `__future__ annotations`,
      # `except A, B:` без скобок, ruff UP с целью из той же планки. У всех
      # трёх соседей 217 держит гейт, и свой код здесь был бы четвёртой
      # реализацией одного алгоритма.
      #
      # Шаги стоят ПОСЛЕДНИМИ намеренно: чекаут каталога ложится в рабочее
      # дерево, а гейты витрины выше обходят его как своё.
      - name: Забрать гейты версии каталога на закреплённой версии
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ArtVsMark/Engineering-Incidents-Playbook
          # Пин тот же, что у остальных трёх инструментов каталога; почему
          # коммит, а не тег, — сказано в rules-inbox.yml.
          ref: b577c644d62b08a8b5a1bc27180ea84ed8363c28 # v1.12.0, 2026-10-14
          path: .py-gates
          fetch-depth: 1

      - name: Версия исполнителя сходится с планкой
        run: python .py-gates/scripts/check_python_version.py --root .

      # ruff закреплён той же версией, что у каталога (его requirements-test.txt):
      # новый ruff приносит новые правила UP, и гейт краснел бы без правки здесь.
      - name: Стиль написан на планке
        run: |
          python -m pip install --quiet --disable-pip-version-check ruff==0.15.20
          python .py-gates/scripts/check_py_style.py --root .

      - name: Убедиться, что вхолостую значит вхолостую
        run: |
          set -euo pipefail
          if ! git diff --quiet; then
            echo "::error::--check изменил рабочее дерево — это не проверка, а сборка"
            git --no-pager diff --stat
            exit 1
          fi
          echo "Рабочее дерево не тронуто."

  # ОБЯЗАТЕЛЬНАЯ 3.15 (решение владельца 14 октября, #337). Python 3.15 вышел
  # стабильным, и наборы витрины проходят на нём наравне с планкой: работа в
  # том же прогоне, её красное делает красным прогон. Планка `requires-python`
  # осталась 3.14 — это обещание (157), — а гейт версий каталога допускает
  # несколько версий, если младшая из них планка.
  #
  # ЗДЕСЬ ТОЛЬКО НАБОРЫ. Гейты дерева от версии не зависят и бегут выше на
  # планке; стиль сверяется с планкой, а не с верхней версией. Список наборов
  # не перечисляется руками: каждый скрипт, объявивший `def selftest`, — иначе
  # новый набор на 3.15 молча не попадал бы (005).
  #
  # ВЕРСИЯ В ИМЕНИ РАБОТЫ — ПО ОБРАЗЦУ КАТАЛОГА: по имени работу различают
  # защита ветки и семья. ЗНАЧКА НЕТ — решение владельца: витрина его не
  # выводит.
  next-stable:
    name: тесты на 3.15
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Забрать витрину
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"

      - name: Наборы проходят на 3.15
        run: |
          set -euo pipefail
          for script in scripts/*.py; do
            grep -q '^def selftest' "$script" || continue
            echo "::group::$script"
            python "$script" --selftest
            echo "::endgroup::"
          done
