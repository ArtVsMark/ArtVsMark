# Третий сторож витрины: изменение готово и не слито.
#
# ЧЕМ ОН ОТЛИЧАЕТСЯ ОТ ДВУХ ДРУГИХ. `staleness` ловит остановку суточной
# сборки, `main-red` — красную общую ветку. Здесь и сборка идёт, и ветка
# зелёная, и само изменение зелёное: не доходит СОБЫТИЕ площадки, и автоматика
# ждёт того, чего больше не будет. Три вопроса, три ответа; свести их в один
# значило бы потерять два.
#
# ПОЧЕМУ КАЖДЫЕ ПОЛЧАСА, А НЕ ЧАЩЕ. Порог — пять минут, и сторож, ходящий раз в
# полчаса, добавляет к нему до получаса ожидания. Ходить чаще незачем: пять
# часов простоя (#146) от получаса не отличаются, а девять минут (#183) человек
# и так увидит быстрее сторожа, если смотрит. Сторож нужен для случая, когда не
# смотрит никто.
#
# ОН ГОВОРИТ, А НЕ ТОЛКАЕТ. Расклинить изменение можно снятием и возвратом
# метки — но делать это за человека значило бы прятать частоту, с которой
# площадка теряет состояние, а видеть её нужно: именно она решает, стоит ли
# заводить обход вообще.
name: stuck-prs

on:
  schedule:
    # Каждые полчаса, минуты не :00 — не попадать в общий пик площадки.
    - cron: "13,43 * * * *"
  # У событийной автоматики всегда есть ручная кнопка (правило 104).
  workflow_dispatch:
    inputs:
      minutes:
        description: "порог в минутах"
        required: false

permissions:
  contents: read
  # Сторож читает изменения и ведёт ОДНУ задачу; закрывать её он не умеет.
  pull-requests: read
  issues: write

concurrency:
  group: stuck-prs
  cancel-in-progress: false

jobs:
  watch:
    name: stuck-prs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          # Сторож зовёт общего помощника разметки — берётся и он.
          # За полнотой этого списка следит check_mechanisms.py::audit_sparse.
          sparse-checkout: |
            scripts/stuck_prs.py
            scripts/checks.py
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Есть ли готовые и не слитые изменения?
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          python3 scripts/stuck_prs.py ${{ inputs.minutes && format('--minutes {0}', inputs.minutes) || '' }}
          rc=$?
          # Код 1 — находка, а не поломка прогона: задача заведена, и этого
          # достаточно. Красное на вкладке добавило бы второй адресат тому же
          # сообщению (правило 142), а красное как фон обесценивает настоящее.
          # Код 2 — сторож не отработал, и вот это уже красное.
          if [ "$rc" -eq 2 ]; then exit 1; fi
          exit 0
