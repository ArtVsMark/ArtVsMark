# Дежурный по общей ветке. Вопрос, которого никто не задавал: зелена ли `main`
# ПРЯМО СЕЙЧАС.
#
# ЦЕНА, ЗАПЛАЧЕННАЯ ЗДЕСЬ. У витрины три прогона, способных покраснеть не на
# изменении, и у `attribution-history` адресата не было никакого. 27 августа он
# покраснел впервые — и увидело это окно лишь потому, что специально пошло
# смотреть после слияния. По своей воле на вкладку прогонов не ходит никто
# (задача #56).
#
# ЛОГИКА ЗДЕСЬ НЕ ЖИВЁТ. Она в каталоге, `scripts/main_red.py`, и берётся
# ссылкой на версию: механизм нужен каждому потребителю с прогонами по
# расписанию, и копия вбок разъехалась бы с первой правки (правило 090).
# Витрина вынесла его туда сама — playbook#139, playbook#141.
#
# ЧТО ОСТАЁТСЯ ЗДЕСЬ: то, что принадлежит ВИТРИНЕ, — заголовок, метка, текст
# задачи и список исключений.
#
# ИСКЛЮЧЕНИЙ У ВИТРИНЫ НЕТ, И ЭТО РЕШЕНИЕ, А НЕ ПРОПУСК. Каталог исключает у
# себя `attribution-history`: его красное означало бы долг прошлой истории,
# который правкой не чинится. Здесь наоборот — долг объявлен заново ключом
# `--since` (изменение #72), и после этого КАЖДОЕ новое красное на нём означает
# новый дефект: коммит в общей ветке составлен без трейлеров. Такое чинится, и
# адресат ему нужен. Исключить его значило бы закрыть ровно ту задачу, ради
# которой дежурный здесь и заведён.
name: main-red

on:
  schedule:
    # Позже суточной сборки (4:23), змейки (3:17) и входящих (6:17): дежурный
    # должен видеть состоявшийся отказ, а не гонку с ним. Минута не круглая —
    # в 0 и 30 площадка обслуживает расписания всей планеты.
    - cron: "41 7 * * *"
  # У событийной автоматики всегда есть ручная кнопка (правило 104).
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  # Дежурный спрашивает вкладку прогонов — это Actions API, и права на него
  # отдельные. Явный блок `permissions` обнуляет всё, что в нём не названо: без
  # этой строки первый же запрос получает 403, и дежурный по красноте краснеет
  # сам, молча. Ровно та слепота, ради которой он заведён.
  actions: read

concurrency:
  group: main-red
  cancel-in-progress: false

jobs:
  watch:
    name: main-red
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Забрать витрину
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Забрать инструмент каталога на закреплённой версии
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ArtVsMark/claude-code-playbook
          # Пин по SHA, как и у входящих: тег переставляют, а подключаться к
          # движущейся ветке значит получать чужую правку в свой прогон.
          #
          # НАЗВАННЫЙ ПРОБЕЛ, тот же самый: сам себя этот пин не подвинет.
          # Dependabot двигает пины по версиям, а свежего тега у каталога нет —
          # закрепиться не на чем. Пока не появится, пин двигается рукой.
          ref: 72938483771f267448e843a9edf93c41653906a0 # main, 2026-08-27
          path: .main-red
          fetch-depth: 1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: У красноты общей ветки есть адресат
        env:
          # Штатного токена достаточно: задача заводится от имени проекта и
          # личности человека не несёт (правила 131, 135).
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # `+e` явным первым действием: площадка зовёт шаг как `bash -e {0}`, и
          # `set -uo pipefail` этот флаг НЕ снимает — разбор кода возврата ниже
          # стал бы мёртвым кодом. Это тот же дефект, на котором написано
          # правило 145, и витрина уже словила его сегодня кодом 2.
          set +e
          python .main-red/scripts/main_red.py \
            --branch main \
            --title "Общая ветка красная: работу не начинают, пока это не починено" \
            --label bug \
            --body-file .github/main-red-issue.md \
            --run-url "$RUN" \
            --apply
          rc=$?
          set -e
          # Три исхода, а не два (правило 039). Красным имеет смысл быть только
          # третьему: красные работы — находка для человека, и задача о них уже
          # заведена; поломка САМОГО дежурного адресата не имеет никакого, и вот
          # о ней узнать надо.
          case "$rc" in
            0) echo "общая ветка зелёная" ;;
            1) echo "::notice::На общей ветке есть красные работы — задача заведена или обновлена." ;;
            *) echo "::error::Дежурный не отработал (код $rc): площадка не ответила, ответ не разобран или трекер недоступен."; exit 1 ;;
          esac
