# Второй рубеж против устаревшей витрины: бежала ли сборка вообще.
#
# ЗАЧЕМ ОН, ЕСЛИ ЕСТЬ ПОДПИСЬ НА СТРАНИЦЕ. Подпись «data as of» отвечает на
# вопрос «когда числа менялись» и видна читателю сразу, не завися от прогонов.
# Здесь другой вопрос: сборка вообще ходила? Числа могут не меняться сутки
# законно, а сборка, не бежавшая двое суток, — уже поломка. Два вопроса, два
# ответа; свести их в один значило бы потерять оба.
#
# ЧЕМ ОН УЯЗВИМ, И ЭТО СКАЗАНО ВСЛУХ. Он сам на расписании, и площадка не
# гарантирует `schedule` — ровно то, из-за чего он и заведён. Два независимых
# расписания пропускаются одновременно реже, чем одно, но «реже» это не
# «никогда». Поэтому он второй, а не первый.
#
# ПОЧЕМУ ТРИЖДЫ В СУТКИ, А НЕ РАЗ. Сторож, который сам ходит раз в сутки, к
# порогу в 36 часов добавляет ещё сутки ожидания. Три прохода стоят три минуты
# в день и сокращают этот довесок до восьми часов.
name: staleness

on:
  schedule:
    # Трижды в сутки, минуты не :00 — не попадать в общий пик площадки.
    - cron: "17 6,14,22 * * *"
  # У событийной автоматики всегда есть ручная кнопка (правило 104).
  workflow_dispatch:
    inputs:
      hours:
        description: "порог в часах"
        required: false

permissions:
  contents: read
  # Сторож ведёт ОДНУ задачу и никогда её не закрывает: закрытие — жест
  # человека, механизм не может сказать «я посмотрел».
  issues: write

concurrency:
  group: staleness
  cancel-in-progress: false

jobs:
  watch:
    name: staleness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          # Сторож зовёт общего помощника разметки — берётся и он.
          # За полнотой этого списка следит check_mechanisms.py::audit_sparse.
          sparse-checkout: |
            scripts/staleness.py
            scripts/checks.py
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Сборка приносила свежие числа?
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          python3 scripts/staleness.py ${{ inputs.hours && format('--hours {0}', inputs.hours) || '' }}
          rc=$?
          # Код 1 — находка, а не поломка прогона: задача заведена, и этого
          # достаточно. Красное на вкладке добавило бы второй адресат тому же
          # сообщению (правило 142), а красное как фон обесценивает настоящее.
          # Код 2 — сторож не отработал, и вот это уже красное.
          if [ "$rc" -eq 2 ]; then exit 1; fi
          exit 0
