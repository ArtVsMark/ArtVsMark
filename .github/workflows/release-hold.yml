# Стоп-кран снимает механизм, когда снимать его больше не о чем.
#
# ЦЕНА, ЗАПЛАЧЕННАЯ ЗДЕСЬ. Изменение открывает `agent-pr` и ставит `hold`:
# автомерж по умолчанию, а тело в момент открытия ещё пустое. Дальше окно
# заполняло тело и снимало метку — и последний шаг держался ПАМЯТЬЮ. 28 августа
# он подвёл на изменении, которое чинило красную общую ветку: изменение стояло
# готовым, проверки зелёные, и ждало, пока кто-то вспомнит. Шаг, который
# работает, пока кто-то не забудет, механизмом не является.
#
# ПОЧЕМУ `workflow_run`, А НЕ `pull_request`. Решение принимается ПОСЛЕ того,
# как проверки досчитались, — на самом изменении такого события нет. Заодно
# `workflow_run` берёт этот файл с общей ветки, а не из изменения: шаг снимает
# стоп-кран, и брать его версию оттуда, что он же и выпускает, нельзя.
#
# ЧЕМ ОН НЕ СПОРИТ С ЧЕЛОВЕКОМ. Решение читается из ТЕЛА изменения, которое
# правит человек, а не из метки, которую правят обе стороны. Вернуть `hold`
# рукой без строки `<!-- hold: причина -->` значило бы объявить войну: следующий
# прогон снял бы её снова. С этой строкой метка держится сколько угодно, и
# причина при этом читается.
name: release-hold

on:
  workflow_run:
    # имя «PR check» — копия прогона .github/workflows/pr-check.yml;
    # переименуют — меняются обе строки (071). «review» — копия имени .github/workflows/review.yml: слияние ждёт
    # вердикта ревью (105), и его завершение — такой же повод решить, как
    # завершение проверки. «ci-complete» — копия имени
    # .github/workflows/ci-complete.yml: сводный гейт тоже проверка головы, и
    # закончи он последним, будить release-hold было бы некому (#345); его же
    # имя читает scripts/stuck_prs.py::REQUIRED.
    workflows: ["PR check", "review", "ci-complete"]
    types: [completed]
  # ВТОРОЙ ПОВОД ПРОСНУТЬСЯ: ТЕЛО ОТРЕДАКТИРОВАЛИ.
  #
  # Решение принимается по телу, а будился прогон только по завершении
  # проверки — и тело, заполненное ПОЗЖЕ, будить было нечему. Замер на #97:
  # проверка досчиталась в 08:15:14, окно дописало тело минутой позже, и
  # изменение простояло со стоп-краном при зелёных проверках, пока его не
  # слили рукой. Тот же случай, ради которого прогон и заводился (#84), только
  # зашедший с другой стороны: помнить теперь должен не человек, а событие,
  # которого не было.
  #
  # ПОЧЕМУ `pull_request_target`, А НЕ `pull_request`. Файл прогона и
  # вызываемые им скрипты берутся с ОБЩЕЙ ветки, а не из изменения: шаг
  # снимает стоп-кран, и брать его версию из того, что он же и выпускает,
  # нельзя. Прежде была и вторая причина — секрет владельца для вооружения
  # автомержа; вооружение с тех пор передано automerge.yml.
  pull_request_target:
    types: [edited]
  # У событийной автоматики всегда есть ручная кнопка (правило 104).
  workflow_dispatch:
    inputs:
      pr:
        description: "номер изменения"
        required: true

permissions:
  contents: read
  # Снимается только метка конвейера. Метки содержания принадлежат автору и
  # этим прогоном не трогаются (правило 064).
  pull-requests: write
  # Вызов automerge.yml кнопкой. Это единственный путь, которым штатный токен
  # будит прогон: события от него площадка прогонами не считает — кроме
  # `workflow_dispatch` и `repository_dispatch`.
  actions: write

concurrency:
  group: release-hold-${{ github.event.workflow_run.head_branch
    || github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: false

jobs:
  release:
    name: release-hold
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Забрать решение со стоп-крана
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          # Не один файл: hold.py зовёт общего помощника разметки, и точечная
          # выборка оборвала бы зависимость — ровно это и случилось 28 августа,
          # когда помощник появился. Список зависимостей теперь проверяет
          # scripts/check_mechanisms.py::audit_sparse.
          sparse-checkout: |
            scripts/hold.py
            scripts/checks.py
            scripts/gh_outcome.py
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Снять стоп-кран, если держать больше нечем
        env:
          # ОДИН ТОКЕН, ШТАТНЫЙ. Здесь стоял и токен владельца — чтобы
          # вооружить автомерж самому: штатному площадка отказывает дословно
          # «Resource not accessible by integration (mergePullRequest)» (#89).
          # Вооружение переехало в automerge.yml, а его прогон штатный токен
          # будить умеет — кнопкой. Лишний секрет — лишние права (131, 135).
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          PR_INPUT: ${{ inputs.pr }}
          PR_EDITED: ${{ github.event.pull_request.number }}
          # Имя СВОЕЙ работы: его же площадка кладёт в список проверок
          # изменения, и по нему прогон себя оттуда и вычёркивает.
          JOB_NAME: release-hold
        run: |
          set +e
          # Номер берётся по ветке, а не из `pull_requests` события: у
          # `workflow_run` этот массив бывает пустым, и «пусто» неотличимо от
          # «изменения нет».
          if [ -n "$PR_INPUT" ]; then
            number="$PR_INPUT"; result="success"
          else
            if [ -n "$PR_EDITED" ]; then
              number="$PR_EDITED"
            else
              # предел: умолчание gh — 30 записей; с фильтром по ветке открытое
              # изменение одно, и берётся первое — другого у ветки не бывает.
              number=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" \
                         --state open --json number --jq '.[0].number // empty')
            fi
            if [ -z "$number" ]; then
              # Печатается командой площадки, а не в обычный вывод: логи прогонов
              # облачному окну закрыты (правило 151), и до него доходят только
              # аннотации. Этот выход стоил расследования ровно потому, что был
              # тихим: прогон отработал «успешно» и не сказал, почему ничего не
              # сделал.
              echo "::notice::Открытого изменения на ${BRANCH:-«ветка не задана»} нет — снимать нечего"
              exit 0
            fi
            # ИСХОД СПРАШИВАЕТСЯ У ПЛОЩАДКИ, А НЕ БЕРЁТСЯ ИЗ СОБЫТИЯ. У события
            # про тело исхода проверок нет вовсе, а исход одного прогона — не
            # исход изменения: с 14 октября слияние ждёт ещё и вердикта ревью
            # (105), и зелёный «PR check» при идущем ревью стоп-кран не снимает.
            # Разбор ответа живёт в scripts/hold.py рядом с решением о
            # стоп-кране: у скрипта есть набор, у шага его не бывает (090).
            rollup=$(gh pr view "$number" --repo "$GITHUB_REPOSITORY" \
                       --json statusCheckRollup --jq '.statusCheckRollup' 2>&1)
            if [ $? -ne 0 ]; then
              echo "::warning::Состояние проверок #$number не прочитано — стоп-кран оставлен: $rollup"
              exit 0
            fi
            # СЕБЯ СПРАШИВАЮЩИЙ НЕ СЧИТАЕТ. Ответ площадки перечисляет все
            # проверки изменения, включая этот самый прогон: спрашивая о себе,
            # он всегда видит себя незавершённым, отвечает «ждём» и оставляет
            # стоп-кран — каждый раз. Замер на #106: прогон от редактирования
            # тела отработал «успешно» и не снял ничего.
            result=$(printf '%s' "$rollup" \
                       | python3 scripts/hold.py --checks-state --ignore-check "$JOB_NAME")
            if [ $? -ne 0 ]; then
              echo "::error::Разбор состояния проверок не отработал — scripts/hold.py"
              exit 1
            fi
            echo "::notice::Проверки #$number: $result (спрашивающий «$JOB_NAME» не в счёт)"
          fi

          gh pr view "$number" --repo "$GITHUB_REPOSITORY" --json body \
            --jq .body > "$RUNNER_TEMP/body.md"
          labels=$(gh pr view "$number" --repo "$GITHUB_REPOSITORY" --json labels \
                     --jq '[.labels[].name] | join(",")')
          # слова release/keep/nothing — договор scripts/hold.py::decide; case ниже
          # повторяет их буквами (071).
          verdict=$(python3 scripts/hold.py --body-file "$RUNNER_TEMP/body.md" \
                      --labels "$labels" --checks "$result")
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::error::Решение о стоп-кране не отработало (код $rc) — scripts/hold.py"
            exit 1
          fi

          # ВООРУЖАЕТ ОДНО МЕСТО — automerge.yml. Здесь стояла своя копия
          # включения автомержа, и 28 сентября она проиграла гонку: gh прочитал
          # состояние `blocked`, а к приходу вызова PR check досчитался, и
          # площадка ответила «is in unstable status». Прогон покраснел, метка
          # уже снята — и повтор его отвечал «стоп-крана нет, трогать нечего».
          # Изменение простояло до ручной кнопки (#233). Разбор такого отказа и
          # слияние «уже сейчас» живут теперь в automerge.yml, одной копией:
          # две копии одного решения разошлись бы на первой же правке (214).
          #
          # Снятие метки штатным токеном прогон automerge не будит, поэтому он
          # зовётся кнопкой: её штатный токен нажать может.
          arm() {
            # ВХОДА `pr` НЕТ: automerge.yml — тонкий вызов шага механизмов, и
            # очередь берёт кандидатов сама, по метке согласия (#345, шаг C).
            # Номер ниже — только для строки отчёта.
            out=$(gh workflow run automerge.yml --repo "$GITHUB_REPOSITORY" \
                    --ref main 2>&1) && rc=0 || rc=$?
            if [ "$rc" -eq 0 ]; then
              echo "::notice::#$1: стоп-кран снят, очередь разбужена — automerge.yml берёт кандидатов сам: с согласием automerge и без hold, голову первой"
              return 0
            fi
            # слова ok/state/broken — договор scripts/gh_outcome.py::classify; case ниже
            # повторяет их буквами: оболочка питон не импортирует (071).
            v=$(printf '%s\n' "$out" | python3 scripts/gh_outcome.py --code "$rc") \
              || v="broken: разбор исходов не отработал — scripts/gh_outcome.py"
            case "$v" in
              state:*)
                echo "::warning::automerge.yml для #$1 не вызван: ${v#state: }. Метка снята, вызовет следующее событие." ;;
              *)
                echo "::error::automerge.yml для #$1 не вызван: $out"
                return 1 ;;
            esac
          }

          case "$verdict" in
            release:*)
              # Метка `hold` — копия scripts/checks.py::HOLD_LABEL — оболочка питон не импортирует;
              # меняется вместе с константой (071).
              gh pr edit "$number" --repo "$GITHUB_REPOSITORY" --remove-label hold
              echo "::notice::Стоп-кран с #$number снят: ${verdict#release: }"
              arm "$number" ;;
            keep:*)
              # Тоже аннотацией: «почему не сняли» — единственное, что доходит
              # до окна, когда прогон отработал и ничего не изменил (151).
              echo "::notice::#$number: стоп-кран остаётся — ${verdict#keep: }" ;;
            *)
              # ДОВООРУЖЕНИЯ ЗДЕСЬ БОЛЬШЕ НЕТ (#345, шаг C). Прежде пустой
              # `autoMergeRequest` значил «метку снял проигравший гонку прогон,
              # и автомерж не включён». У очереди механизмов значок несёт только
              # взведённая голова, и пустое поле у остальных — норма: повтор жал
              # бы automerge.yml впустую на каждом событии. А automerge.yml сам
              # будится теми же завершениями PR check, review и ci-complete.
              echo "::notice::#$number: ${verdict#nothing: }" ;;
          esac
