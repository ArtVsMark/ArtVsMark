# Стоп-кран снимает механизм, когда снимать его больше не о чем.
#
# ЦЕНА, ЗАПЛАЧЕННАЯ ЗДЕСЬ. Изменение открывает `open-pr` и ставит `hold`:
# автомерж по умолчанию, а тело в момент открытия ещё пустое. Дальше окно
# заполняло тело и снимало метку — и последний шаг держался ПАМЯТЬЮ. 28 августа
# он подвёл на изменении, которое чинило красную общую ветку: изменение стояло
# готовым, проверки зелёные, и ждало, пока кто-то вспомнит. Шаг, который
# работает, пока кто-то не забудет, механизмом не является.
#
# ПОЧЕМУ `workflow_run`, А НЕ `pull_request`. Решение принимается ПОСЛЕ того,
# как проверки досчитались, — на самом изменении такого события нет. Заодно
# `workflow_run` берёт этот файл с общей ветки, а не из изменения: шаг снимает
# стоп-кран, и брать его версию оттуда, что он же и выпускает, нельзя.
#
# ЧЕМ ОН НЕ СПОРИТ С ЧЕЛОВЕКОМ. Решение читается из ТЕЛА изменения, которое
# правит человек, а не из метки, которую правят обе стороны. Вернуть `hold`
# рукой без строки `<!-- hold: причина -->` значило бы объявить войну: следующий
# прогон снял бы её снова. С этой строкой метка держится сколько угодно, и
# причина при этом читается.
name: release-hold

on:
  workflow_run:
    workflows: ["PR check"]
    types: [completed]
  # ВТОРОЙ ПОВОД ПРОСНУТЬСЯ: ТЕЛО ОТРЕДАКТИРОВАЛИ.
  #
  # Решение принимается по телу, а будился прогон только по завершении
  # проверки — и тело, заполненное ПОЗЖЕ, будить было нечему. Замер на #97:
  # проверка досчиталась в 08:15:14, окно дописало тело минутой позже, и
  # изменение простояло со стоп-краном при зелёных проверках, пока его не
  # слили рукой. Тот же случай, ради которого прогон и заводился (#84), только
  # зашедший с другой стороны: помнить теперь должен не человек, а событие,
  # которого не было.
  #
  # ПОЧЕМУ `pull_request_target`, А НЕ `pull_request`. Прогону нужен секрет
  # владельца, чтобы вооружить автомерж, а у `pull_request` из форка секретов
  # нет вовсе. Заодно файл прогона и вызываемые им скрипты берутся с ОБЩЕЙ
  # ветки, а не из изменения: шаг снимает стоп-кран, и брать его версию из
  # того, что он же и выпускает, нельзя.
  pull_request_target:
    types: [edited]
  # У событийной автоматики всегда есть ручная кнопка (правило 104).
  workflow_dispatch:
    inputs:
      pr:
        description: "номер изменения"
        required: true

permissions:
  contents: read
  # Снимается только метка конвейера. Метки содержания принадлежат автору и
  # этим прогоном не трогаются (правило 064).
  pull-requests: write

concurrency:
  group: release-hold-${{ github.event.workflow_run.head_branch
    || github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: false

jobs:
  release:
    name: release-hold
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Забрать решение со стоп-крана
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          # Не один файл: hold.py зовёт общего помощника разметки, и точечная
          # выборка оборвала бы зависимость — ровно это и случилось 28 августа,
          # когда помощник появился. Список зависимостей теперь проверяет
          # scripts/check_mechanisms.py::audit_sparse.
          sparse-checkout: |
            scripts/hold.py
            scripts/checks.py
            scripts/gh_outcome.py
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Снять стоп-кран, если держать больше нечем
        env:
          # ДВА ТОКЕНА, И ЭТО НЕ ИЗБЫТОЧНОСТЬ. Снять метку штатный токен может;
          # вооружить автомерж — нет: замер 28 августа на #89 дал дословно
          # «GraphQL: Resource not accessible by integration (mergePullRequest)».
          # Личность здесь та же, что открывает изменения (open-pr.yml), и
          # второе следствие важнее первого: события от `GITHUB_TOKEN` площадка
          # прогонами не считает, а от токена владельца — считает.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER_TOKEN: ${{ secrets.MERGE_QUEUE_TOKEN }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          RESULT: ${{ github.event.workflow_run.conclusion }}
          PR_INPUT: ${{ inputs.pr }}
          PR_EDITED: ${{ github.event.pull_request.number }}
        run: |
          set +e
          # Номер берётся по ветке, а не из `pull_requests` события: у
          # `workflow_run` этот массив бывает пустым, и «пусто» неотличимо от
          # «изменения нет».
          if [ -n "$PR_INPUT" ]; then
            number="$PR_INPUT"; result="success"
          elif [ -n "$PR_EDITED" ]; then
            # Событие про ТЕЛО, и исхода проверок в нём нет вовсе — его
            # спрашивают у площадки. Разбор ответа живёт в scripts/hold.py
            # рядом с решением о стоп-кране: у скрипта есть набор, у шага его
            # не бывает (правило 090).
            number="$PR_EDITED"
            rollup=$(gh pr view "$number" --repo "$GITHUB_REPOSITORY" \
                       --json statusCheckRollup --jq '.statusCheckRollup' 2>&1)
            if [ $? -ne 0 ]; then
              echo "::warning::Состояние проверок #$number не прочитано — стоп-кран оставлен: $rollup"
              exit 0
            fi
            result=$(printf '%s' "$rollup" | python3 scripts/hold.py --checks-state)
            if [ $? -ne 0 ]; then
              echo "::error::Разбор состояния проверок не отработал — scripts/hold.py"
              exit 1
            fi
            echo "Проверки #$number: $result"
          else
            number=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" \
                       --state open --json number --jq '.[0].number // empty')
            result="$RESULT"
          fi
          if [ -z "$number" ]; then
            echo "открытого изменения на $BRANCH нет — снимать нечего"
            exit 0
          fi

          gh pr view "$number" --repo "$GITHUB_REPOSITORY" --json body \
            --jq .body > "$RUNNER_TEMP/body.md"
          labels=$(gh pr view "$number" --repo "$GITHUB_REPOSITORY" --json labels \
                     --jq '[.labels[].name] | join(",")')
          verdict=$(python3 scripts/hold.py --body-file "$RUNNER_TEMP/body.md" \
                      --labels "$labels" --checks "$result")
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::error::Решение о стоп-кране не отработало (код $rc) — scripts/hold.py"
            exit 1
          fi

          case "$verdict" in
            release:*)
              gh pr edit "$number" --repo "$GITHUB_REPOSITORY" --remove-label hold
              echo "::notice::Стоп-кран с #$number снят: ${verdict#release: }"
              # ДОВЕСТИ ДО КОНЦА, А НЕ ОСТАВИТЬ НА ЧЕЛОВЕКА. Снятая метка сама
              # по себе ничего не двигает: площадка НЕ будит прогоны событиями,
              # порождёнными `GITHUB_TOKEN`, — значит `automerge` на это снятие
              # не проснётся. Замер 28 августа на #87: release-hold отработал
              # дважды с исходом success, метка исчезла, а последний прогон
              # automerge остался тем, что бежал ДО снятия. Механизм сработал
              # наполовину и отчитался успехом — ровно то, против чего 146.
              #
              # Метод squash задан явно: при merge автором коммита в main
              # становится тот, кто нажал, и трейлеры не доезжают до
              # первопредков (.rules/README.md § Атрибуция коммитов).
              # Секрета нет — предупреждение и выход, а не отказ: ненастроенная
              # возможность не есть поломка (051). Метка уже снята, и изменение
              # поедет со следующим событием.
              if [ -z "${OWNER_TOKEN:-}" ]; then
                echo "::warning::MERGE_QUEUE_TOKEN не задан — автомерж на #$number не вооружён. Стоп-кран снят, изменение поедет со следующим событием."
                exit 0
              fi
              out=$(GH_TOKEN="$OWNER_TOKEN" gh pr merge "$number" \
                      --repo "$GITHUB_REPOSITORY" --auto --squash 2>&1) && rc=0 || rc=$?
              if [ "$rc" -ne 0 ]; then
                v=$(printf '%s\n' "$out" | python3 scripts/gh_outcome.py --code "$rc") \
                  || v="broken: разбор исходов не отработал — scripts/gh_outcome.py"
                case "$v" in
                  state:*)
                    echo "::warning::Автомерж на #$number не включён: ${v#state: }. Метка снята, изменение поедет со следующим событием." ;;
                  *)
                    echo "::error::Автомерж на #$number не включён: $out"
                    exit 1 ;;
                esac
              else
                echo "::notice::Автомерж на #$number вооружён (squash)"
              fi ;;
            keep:*)
              echo "#$number: стоп-кран остаётся — ${verdict#keep: }" ;;
            *)
              echo "#$number: ${verdict#nothing: }" ;;
          esac
