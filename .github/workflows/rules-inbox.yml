# Нерассмотренные правила каталога попадают в трекер, а не в чью-то память.
#
# ЗАЧЕМ. Свод говорит: первый непустой источник работы и есть план, и первый в
# списке — задачи этого репозитория (правило 091). Правила же приходят в чужом
# каталоге и до трекера не доезжают: сборка метрик дописывает их в
# `.rules/bindings.json` со статусом `unreviewed`, и там они лежат ровно до тех
# пор, пока кто-нибудь не откроет файл. За один день каталог вырос со 130 до
# 140 записей, и заметить это можно было только случайно.
#
# ЧТО ДЕЛАЕТ. Тянет экспорт каталога обычным HTTPS, сверяет с нашим ответом и
# ведёт ОДНУ задачу-«входящие»: обновляет ту же, а не заводит новую каждый
# прогон (правило 104).
#
# ПОЧЕМУ СВОЕГО СКРИПТА НЕТ. Логика живёт в каталоге и подключается ссылкой на
# версию. Копия в третьем репозитории разъехалась бы с первой правкой на той
# стороне — правило 090 и прямой отвергнутый вариант в контракте потребления.
#
# ПОЧЕМУ ОТДЕЛЬНЫЙ ПРОГОН, А НЕ ШАГ В СБОРКЕ МЕТРИК. Задача #15 предлагала
# второе — она писалась, когда каталог никакого действия не публиковал. Теперь
# публикует, и встраивание в `metrics.yml` стоило бы дороже: тому прогону
# пришлось бы получить право писать задачи, которое ему не нужно, а чужой
# чекаут лёг бы в рабочее дерево, из которого этот же прогон пушит ветку.
# Расписания у них тоже разные по смыслу.
#
# ТРЕТИЙ ИСХОД. Нерассмотренные правила прогон НЕ роняют — это очередь, а не
# поломка. Красным становится только «механизм не отработал»: каталог не
# ответил, ответ не разобран, трекер недоступен (правило 039).
name: rules-inbox

on:
  schedule:
    # Не в 0 и не в 30: минута выбрана так, чтобы не попадать в общий пик.
    - cron: "17 6 * * *"
  # У событийной автоматики всегда есть ручная кнопка (правило 104).
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: rules-inbox
  # Задача ведётся идемпотентно, но две гонки за одну и ту же запись способны
  # завести вторую: отмена посередине дешевле.
  cancel-in-progress: true

jobs:
  inbox:
    runs-on: ubuntu-latest
    # Без этого действует умолчание GitHub в шесть часов.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ПОЧЕМУ ЗДЕСЬ СКРИПТ КАТАЛОГА, А НЕ ЕГО ДЕЙСТВИЕ. Логика в обоих случаях
      # чужая и берётся ссылкой на версию — своей копии нет (правило 090).
      #
      # ПРЕЖНЯЯ ПРИЧИНА СНЯТА, И ЭТО ПРОВЕРЕНО, А НЕ ПРЕДПОЛОЖЕНО. Здесь стояло
      # «у действия исходов два вместо трёх»: композитный шаг запускается как
      # `bash -eo pipefail`, разбор кода возврата написан ПОСЛЕ команды, и шаг
      # умирал на первом же ненулевом коде — очередь нерассмотренных правил
      # красила бы прогон каждый день. 8 сентября в `action.yml` каталога стоит
      # `|| rc=$?` с объяснением того же дефекта: починено на той стороне.
      #
      # ПРИЧИНА ОСТАЛАСЬ ДРУГАЯ — ПОКРЫТИЕ. Действие делает только «входящие»;
      # обратных ссылок (второй шаг ниже) в нём нет, а им нужен тот же чекаут
      # каталога. Переезд означал бы ДВА чекаута одного репозитория в одном
      # прогоне ради одного шага. Переедем, когда действие закроет обе половины
      # либо когда обратные ссылки уедут в своё.
      - name: Забрать инструмент каталога на закреплённой версии
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ArtVsMark/Engineering-Incidents-Playbook
          # Пин по SHA, как и у остальных: тег переставляют, а «подключаться к
          # движущейся ветке значит получать чужую правку в свой прогон» — это
          # предупреждение самого контракта.
          #
          # НАЗВАННЫЙ ПРОБЕЛ: сам себя этот пин не подвинет, и цена названа
          # замером, а не опасением. Dependabot двигает пины действий, а это
          # чекаут чужого репозитория — его он не видит вовсе. Прежний пин
          # простоял с 27 августа и отстал на 239 коммитов; инструмент на нём
          # знал СТАРОЕ имя каталога, и задача-«входящие» показывала витрине
          # ссылку на репозиторий, которого больше нет под этим именем, вместе
          # с числом правил 193 при 195 живых.
          #
          # ТЕГ ЗДЕСЬ НЕ ГОДИТСЯ, И ЭТО ТОЖЕ ЗАМЕР. Тег у каталога появился
          # (v1.2.0, 3 сентября), но инструмент правится чаще выпусков: в теге
          # нет ни починки кода возврата у `link_trails.py`, ни разбора
          # исчерпанной квоты в `ghcli.py`. Поэтому пин на коммит, и двигается
          # он рукой — с сухим прогоном на нашем `bindings.json` перед сдвигом.
          ref: 17c962c08fe6b991de3486d54a669b957ee95133 # main, 2026-09-08
          path: .rules-sync
          fetch-depth: 1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # ЧЕКАУТ ПОЛНЫЙ, И ТЕПЕРЬ ЭТО ВАЖНО: инструменты каталога зовут соседний
      # модуль `scripts/ghcli.py` и команду `gh`. Точечная выборка (sparse)
      # оборвала бы первое молча — ровно тот случай, который у себя ловит
      # scripts/check_mechanisms.py::audit_sparse; `gh` стоит на раннере
      # площадки, и токен ему задан ниже.
      - name: Сверить правила каталога с ответом витрины
        env:
          # Штатного токена достаточно: задача заводится от имени проекта и
          # личности человека не несёт. Токен владельца здесь был бы лишними
          # правами (правила 131, 135).
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # `+e` явным первым действием: без него разбор кода возврата ниже —
          # мёртвый код, ровно как в действии каталога.
          set +e
          python .rules-sync/scripts/sync_inbox.py --bindings .rules/bindings.json
          rc=$?
          set -e
          # Три исхода, а не два (правило 039): 0 — чисто, 1 — есть очередь,
          # 2 — механизм не отработал. Красным имеет смысл быть только третьему:
          # нерассмотренные правила это работа, а не поломка конвейера.
          case "$rc" in
            0) echo "нерассмотренных нет" ;;
            1) echo "::notice::Есть нерассмотренные правила каталога — задача-«входящие» обновлена. Это очередь, а не поломка." ;;
            *) echo "::error::Синхронизация не отработала (код $rc): каталог не ответил, ответ не разобран или трекер недоступен."; exit 1 ;;
          esac

      # Вторая сторона следа: у правила есть номер нашей задачи, а у задачи о
      # правиле не было ни слова — и следующий разбор того же места начинался с
      # нуля, потому что вывод прошлого лежит в каталоге. Заказано задачей #15.
      #
      # Инструмент чужой и берётся ссылкой на ту же закреплённую версию: у
      # грейдера такой написан свой, и третья реализация одного алгоритма
      # разъехалась бы с первой правки (правило 090). Витрина вынесла его в
      # каталог сама — playbook#152.
      #
      # Ходит по СВОИМ задачам: следы чужих проектов разбор не берёт, и это
      # проверяется его набором с обеих сторон. Пишет одну запись на задачу,
      # находит её по скрытому маркеру.
      - name: Задача знает, что породила правило
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          python .rules-sync/scripts/link_trails.py \
            --repo "$GITHUB_REPOSITORY" \
            --label rule-source \
            --apply
          rc=$?
          set -e
          # Три исхода, а не два. Красным имеет смысл быть только третьему:
          # дописанная обратная ссылка — работа механизма, а не поломка.
          case "$rc" in
            0) echo "обратные ссылки на месте" ;;
            1) echo "::notice::Обратные ссылки дописаны в задачи со следом." ;;
            *) echo "::error::Обратная ссылка не отработала (код $rc): экспорт каталога не прочитан или трекер недоступен."; exit 1 ;;
          esac

