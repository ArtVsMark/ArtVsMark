# Нерассмотренные правила каталога попадают в трекер, а не в чью-то память.
#
# ЗАЧЕМ. Свод говорит: первый непустой источник работы и есть план, и первый в
# списке — задачи этого репозитория (правило 091). Правила же приходят в чужом
# каталоге и до трекера не доезжают: сборка метрик дописывает их в
# `.rules/bindings.json` со статусом `unreviewed`, и там они лежат ровно до тех
# пор, пока кто-нибудь не откроет файл. За один день каталог вырос со 130 до
# 140 записей, и заметить это можно было только случайно.
#
# ЧТО ДЕЛАЕТ. Тянет экспорт каталога обычным HTTPS, сверяет с нашим ответом и
# ведёт ОДНУ задачу-«входящие»: обновляет ту же, а не заводит новую каждый
# прогон (правило 104).
#
# ПОЧЕМУ СВОЕГО СКРИПТА НЕТ. Логика живёт в каталоге и подключается ссылкой на
# версию. Копия в третьем репозитории разъехалась бы с первой правкой на той
# стороне — правило 090 и прямой отвергнутый вариант в контракте потребления.
#
# ПОЧЕМУ ОТДЕЛЬНЫЙ ПРОГОН, А НЕ ШАГ В СБОРКЕ МЕТРИК. Задача #15 предлагала
# второе — она писалась, когда каталог никакого действия не публиковал. Теперь
# публикует, и встраивание в `metrics.yml` стоило бы дороже: тому прогону
# пришлось бы получить право писать задачи, которое ему не нужно, а чужой
# чекаут лёг бы в рабочее дерево, из которого этот же прогон пушит ветку.
# Расписания у них тоже разные по смыслу.
#
# ТРЕТИЙ ИСХОД. Нерассмотренные правила прогон НЕ роняют — это очередь, а не
# поломка. Красным становится только «механизм не отработал»: каталог не
# ответил, ответ не разобран, трекер недоступен (правило 039).
name: rules-inbox

on:
  schedule:
    # Не в 0 и не в 30: минута выбрана так, чтобы не попадать в общий пик.
    - cron: "17 6 * * *"
  # У событийной автоматики всегда есть ручная кнопка (правило 104).
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: rules-inbox
  # Задача ведётся идемпотентно, но две гонки за одну и ту же запись способны
  # завести вторую: отмена посередине дешевле.
  cancel-in-progress: true

jobs:
  inbox:
    runs-on: ubuntu-latest
    # Без этого действует умолчание GitHub в шесть часов.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Пин по SHA, как и у остальных действий: тег переставляют, а «подключаться
      # к движущейся ветке значит получать чужую правку в свой прогон» — это
      # предупреждение самого контракта потребления.
      #
      # НАЗВАННЫЙ ПРОБЕЛ: сам себя этот пин не подвинет. Dependabot двигает пины
      # по версиям, а у каталога единственный тег `0.1.0` старше и контракта, и
      # этого действия — закрепиться не на чем. Пока в каталоге не появится
      # свежий тег, пин двигается рукой; заявлено там же.
      - uses: ArtVsMark/claude-code-playbook@96a90ffeb312fbcf40b7097ed7c9ce8ddfc1f2eb # main, 2026-08-22
        with:
          # Штатного токена достаточно: задача заводится от имени проекта и
          # личности человека не несёт. Токен владельца здесь был бы лишними
          # правами (правила 131, 135).
          token: ${{ secrets.GITHUB_TOKEN }}
