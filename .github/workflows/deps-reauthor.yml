# Переоформляет правку dependabot от имени владельца, с ботом в соавторах.
#
# ЗАЧЕМ. Автором squash-коммита площадка ставит автора ИЗМЕНЕНИЯ, и изменение
# dependabot легло бы в `main` за подписью бота. Гейт каталога ловит это ещё на
# изменении — автором стоит имя, которое в .github/authors.txt числится
# соавтором, — и #209 простояло так с 14 сентября: ни одно обновление
# зависимостей не слилось с тех пор, как гейт появился.
#
# РЕШЕНИЕ ВЛАДЕЛЬЦА 24 СЕНТЯБРЯ — вариант A, как у суточной пересборки: автор
# владелец, исполнитель трейлером. Отвергнутый вариант B — раздел «машины» в
# списке, где боту разрешено быть автором, — ослаблял бы правило у четырёх
# проектов сразу. Подробно — в докстроке scripts/reauthor_deps.py.
#
# ПОЧЕМУ ПО РАСПИСАНИЮ, А НЕ ПО СОБЫТИЮ БОТА. Прогон, разбуженный dependabot,
# получает только секреты Dependabot, а `MERGE_QUEUE_TOKEN` лежит в секретах
# Actions. Без токена владельца изменение не откроется от его имени, а пуш
# штатным токеном не разбудил бы `agent-pr` вовсе. Расписание выполняется от
# имени репозитория, и секреты у него свои. Бот ходит раз в неделю, по
# понедельникам (.github/dependabot.yml), — суточного расписания хватает с
# запасом, и прогон без изменений бота заканчивается одной строкой.
#
# ЧТО НЕ ДЕЛАЕТСЯ И ПОЧЕМУ. Изменение бота не закрывается: он закроет его сам,
# когда обновление окажется в `main`. До тех пор оно красное на гейте
# атрибуции — и это защита, а не шум: зелёным его взял бы автомерж.
name: deps-reauthor

on:
  schedule:
    # Раз в сутки, после суточной пересборки (04:23) и в стороне от пика :00.
    - cron: "47 5 * * *"
  # У событийной автоматики всегда есть ручная кнопка (правило 104).
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: deps-reauthor
  # Прогон пушит ветку: отмена посередине оставила бы её без изменения.
  cancel-in-progress: false

jobs:
  reauthor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MERGE_QUEUE_TOKEN: ${{ secrets.MERGE_QUEUE_TOKEN }}
    steps:
      # Без токена владельца переоформлять незачем: изменение открылось бы от
      # имени бота площадки и не получило бы проверок. Отказ, а не пропуск:
      # обновление зависимостей иначе встало бы молча — ровно как #209.
      - name: токен владельца задан
        if: env.MERGE_QUEUE_TOKEN == ''
        run: |
          echo "::error::MERGE_QUEUE_TOKEN не задан — правку dependabot некому переоформить от имени владельца. Нужен PAT владельца с правами contents:write и pull-requests:write."
          exit 1

      # Учётные данные владельца кладёт checkout: пуш ими будит `agent-pr`,
      # и изменение открывается от его имени тем же путём, что и любое другое.
      - name: Забрать витрину
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ env.MERGE_QUEUE_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Проверить переоформление тем, что оно обязано отобрать и отвергнуть
        run: python scripts/reauthor_deps.py --selftest

      # Список изменений читается штатным токеном: чтения ему хватает, а
      # писать отсюда в API нечего — пишет только пуш.
      - name: Переоформить правки dependabot от имени владельца
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/reauthor_deps.py
