# Генерирует анимацию «змейки» по графику контрибуций и кладёт её в ветку
# `output`. README ссылается на неё оттуда, поэтому в `main` бинарных
# артефактов не появляется.
#
# Первый прогон запускается сразу после мержа в `main` — до него ссылка в
# README ведёт в никуда, и это ожидаемо.
name: Contribution snake

# ЧЕМ ЗДЕСЬ СЛУЖИТ РАСПИСАНИЕ (правило 169). Оно ОСНОВНОЙ повод, а не
# страховка события: график контрибуций меняется сам по себе, без единого пуша
# в этот репозиторий, и картинка устаревает от чужой активности. Пуш в `main`
# — второй повод, чтобы свежая страница не ждала до ночи; он ничего не
# подстраховывает, и обратное тоже верно — расписание не подхватывает
# потерянный пуш. Страховок у витрины нет ни одной, поэтому и замерять нечего:
# расписание площадки означает «когда-нибудь», и класть на него ожидание в
# минутах нельзя.
on:
  schedule:
    # Раз в сутки; минута нарочно не :00, чтобы не попадать в общий пик.
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Без этого действует умолчание GitHub в шесть часов.
    timeout-minutes: 10
    steps:
      - name: Сгенерировать SVG для светлой и тёмной темы
        uses: Platane/snk@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?palette=github-light
            dist/snake-dark.svg?palette=github-dark

      - name: Опубликовать в ветку output
        uses: crazy-max/ghaction-github-pages@1d6ee9b181a81033a16bd707a1401afa978daab4 # v5.0.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
