# АВТОМЕРЖ — ОБЩИЙ ШАГ МЕХАНИЗМОВ `step-automerge.yml` (#345, шаг C).
#
# Тонкий вызов по образцу `.github/workflows/automerge.yml` Engineering-Pipeline-
# Mechanisms. Очередь, ранги, подтягивание базы у головы, слияние уплотнением
# токеном владельца и тело уплотнения (`squash_body.py`) — у шага; здесь только
# то, что решает витрина: когда будить.
#
# ЗАЧЕМ ПЕРЕЕЗД. Свой автомерж только вооружал встроенный автомерж площадки, и
# слитое без внешнего взгляда не оставляло следа: #349 правил review.yml, агент
# взгляда пропустил себя, и вердикта не было ни на голове, ни после. Шаг
# механизмов после каждого захода пишет такое слитое в реестр непросмотренного
# (`unlooked.py --apply`), откуда его берёт поздний взгляд (`review / late-queue`).
#
# КАНДИДАТ — МЕТКА `automerge` (согласие), СТОП — `hold`. Согласие ставит
# agent-pr.yml при открытии вместе с `hold`; release-hold.yml снимает `hold`,
# когда зелены ВСЕ проверки головы, и изменение становится кандидатом. Так
# «автомерж по умолчанию, отключается `hold`» и «слияние ждёт вердикта» (105)
# держатся по-прежнему. Состав меток — .github/labels.yml: шаг сверяет с ним
# каждую читаемую метку и без него отказывает.
#
# ТОКЕН — ВЛАДЕЛЬЦА (`MERGE_QUEUE_TOKEN`), иначе автором слияния станет
# приложение (131). Нет токена — шаг предупреждает и не сливает.
name: automerge

on:
  pull_request:
    types: [labeled, unlabeled, ready_for_review, converted_to_draft, synchronize]
  # После проверок головы. У механизмов здесь `ci` и `review`; у витрины прогона
  # `ci` нет — его место занимают `PR check` и сводный `ci-complete`, как у
  # release-hold.yml.
  workflow_run:
    workflows: ["PR check", "review", "ci-complete"]
    types: [completed]
  # У событийной автоматики всегда есть ручная кнопка (правило 104). Её же жмёт
  # release-hold.yml после снятия `hold`: снятие метки штатным токеном прогоны
  # не будит.
  workflow_dispatch:

permissions:
  contents: read
  checks: read
  pull-requests: read
  # Реестр непросмотренного — задача, её заводит и правит шаг.
  issues: write

# Очередь одна на репозиторий, и заход не снимает заход: снятый посреди слияния
# оставил бы изменение взведённым без хозяина.
concurrency:
  group: automerge
  cancel-in-progress: false

jobs:
  # Код шага — по коммиту выпуска v1.8.0 (тот же, что у ci-complete.yml и
  # review.yml), а не по тегу: `check_mechanisms.py::pinned_actions` требует SHA.
  # `skip-branches` — та же строка, что у review.yml: слитое с машинной ветки
  # не встаёт в реестр непросмотренного (051); копия
  # scripts/checks.py::MACHINE_BRANCHES, совпадение держит
  # scripts/check_mechanisms.py::skip_branches_match (214).
  automerge:
    uses: ArtVsMark/Engineering-Pipeline-Mechanisms/.github/workflows/step-automerge.yml@7cd39af2005ceb7564cba9324a42b375331fa4c8 # v1.8.0
    with:
      skip-branches: "dependabot/ chore/metrics chore/deps- chore/changelog"
    secrets:
      MERGE_QUEUE_TOKEN: ${{ secrets.MERGE_QUEUE_TOKEN }}
