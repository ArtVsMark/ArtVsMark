# Атрибуция в ИТОГОВОЙ истории общей ветки, а не в коммитах ветки.
#
# Правило 123 требует проверять её именно там: гейт на изменении бывает
# зелёным, а в первопредках `main` трейлеров не окажется вовсе — ровно это и
# случилось у витрины дважды, когда изменения слили кнопкой интерфейса.
#
# ПОЧЕМУ ОТДЕЛЬНЫМ ФАЙЛОМ, А НЕ РАБОТОЙ В `pr-check.yml`. Работа с условием `if`
# даёт на изменениях проверку с исходом `skipped`. Площадка считает такое
# изменение НЕ чистым, и автомерж ему включить нельзя — одна пропущенная работа
# тихо сломала бы весь конвейер слияния. Отдельный файл со своим событием
# проверки на изменениях не создаёт вовсе.
#
# ПОЧЕМУ ЗДЕСЬ СКРИПТ КАТАЛОГА, А НЕ ЕГО ДЕЙСТВИЕ. Логика в обоих случаях чужая
# и берётся ссылкой на версию — своей копии нет ни там, ни тут (правило 090).
# Но действие не передаёт вниз ключ `--since`, то есть объявленное начало долга:
# через него проверка всегда идёт по ВСЕЙ истории. У витрины 33 первопредка без
# трейлеров — слитые кнопкой и своим скриптом, переписать их нельзя. Прогон
# через действие был бы красным всегда, а гейт, который краснеет неотвратимо,
# перестают читать (правило 051). Запрошено в каталоге; переедем на действие,
# когда ключ появится.
#
# ЧТО ОЗНАЧАЕТ КРАСНОЕ ЗДЕСЬ. Не «нельзя слить», а «коммит в общей ветке
# составляется без трейлеров» — чинится на стороне слияния, а не правкой
# изменения. Историю `main` не переписывают.
name: attribution-history

on:
  push:
    branches: [main]
  # У событийной автоматики всегда есть ручная кнопка (правило 104).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: attribution-history
  cancel-in-progress: true

jobs:
  first-parents:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Забрать витрину
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Первопредки — вся история общей ветки, мелкого клона мало.
          fetch-depth: 0

      - name: Забрать гейт каталога на закреплённой версии
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ArtVsMark/claude-code-playbook
          ref: 96a90ffeb312fbcf40b7097ed7c9ce8ddfc1f2eb # main, 2026-08-22
          path: .attribution-gate
          fetch-depth: 1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Атрибуция доехала до первопредков main
        run: |
          python .attribution-gate/scripts/check_attribution.py \
            --repo "$GITHUB_WORKSPACE" \
            --authors .github/authors.txt \
            --first-parents --ref HEAD \
            --since ca0d920819dfd57e5bb07a458c146c909a2fc4cd
        # Объявленное начало долга сдвинуто ЧЕТВЁРТЫЙ раз, и это стоит назвать
        # прямо, а не спрятать в комментарий про 114.
        #
        # Каждый раз долг создавал РАЗНЫЙ дефект в атрибуции, и каждый раз
        # причина чинилась тем же изменением, что двигало точку:
        #   ca7dfcd — изменение открыло окно, а не владелец (#67). Причина
        #             закрыта #68: изменение открывает open-pr.yml;
        #   aa71d24 — суточная сборка подписывала коммиты ботом площадки, и
        #             squash дописал его в соавторы. Причина закрыта тем же
        #             изменением: metrics.yml подписывает владельцем;
        #   1f5c8a2 — ТА ЖЕ ПОЧИНКА И СОЗДАЛА СЛЕДУЮЩИЙ ДЕФЕКТ. Убрав бота из
        #             авторов коммитов, она убрала и расхождение, ради которого
        #             площадка дописывала `Co-authored-by`, — и три суточные
        #             пересборки (#91, #93, #94) уехали в общую ветку вовсе без
        #             атрибуции. Причина закрыта тем же изменением: прогон
        #             называет исполнителя трейлером сам, а имя внесено в
        #             .github/authors.txt осознанно и с границей;
        #   ca0d920 — изменение #97 уехало в `main` без единого трейлера. Здесь
        #             долг создало не чужое поведение и не предыдущая починка, а
        #             ОКНО: оно собрало сообщение коммита само и хвостовой блок
        #             не поставило. Зелёными при этом были все проверки на
        #             изменении, потому что наличие трейлера не спрашивал никто:
        #             гейт каталога на диапазоне изменения считает такие коммиты
        #             числом, но не отвергает, — требует он их только на
        #             первопредках, то есть уже после слияния. Причина закрыта
        #             тем же изменением: scripts/check_author.py::unattributed
        #             отвергает коммит без трейлера НА ИЗМЕНЕНИИ, и это проверено
        #             на самом ca0d920 — тот же гейт краснеет на нём задним
        #             числом.
        #
        # ЭТО ЧЕТВЁРТЫЙ СДВИГ, И ОН ЖЕ ПОВОД СКАЗАТЬ НЕПРИЯТНОЕ: два из четырёх
        # долгов создало не чужое поведение, а наша собственная предыдущая
        # починка, а четвёртый — окно, забывшее хвостовой блок. Гейт первопредков
        # ловит ровно это — то, чего не видно ни на одном изменении по
        # отдельности, потому что каждое было зелёным.
        #
        # У четвёртого есть отличие, и оно в пользу механизма: этот долг был
        # предотвратим ДО слияния. Три первых виднелись только в итоговой
        # истории; здесь же коммит лежал в изменении, его тело можно было
        # прочитать, и не читал его никто. Поэтому починка причины — не «окно
        # будет внимательнее», а проверка на изменении.
        #
        # ГРАНИЦА, ЗА КОТОРОЙ ЭТО СТАНЕТ ЗАМАЗЫВАНИЕМ: точка двигается только
        # вместе с починкой причины. Сдвиг без починки означал бы, что дефект
        # остался, а гейт перестал о нём говорить, — и тогда это уже не
        # объявленный долг, а выключенная проверка.
        #
        # Было `80605fc` — первый коммит, который в `main` положил нынешний
        # механизм слияния (#45). Стало `ca7dfcd` — коммит, приехавший 27 августа
        # за подписью `claude[bot]`: изменение #67 открыло окно, а не владелец, и
        # площадка поставила автором squash автора ИЗМЕНЕНИЯ. Владелец при этом
        # уехал в `Co-authored-by`, которого нет в `.github/authors.txt`, и гейт
        # покраснел справедливо.
        #
        # ПОЧЕМУ НЕ ЧИНИМ ВМЕСТО СДВИГА. Чинить нечем: история `main` не
        # переписывается. Оставить как есть тоже нельзя — красное стало бы
        # ВЕЧНЫМ, а вечное красное не сигнал, а фон (правило 051). У соседа это
        # уже стоило четырёх дней: рядом с неотвратимо красным прогоном никто не
        # заметил другого, настоящего отказа (правило 142).
        #
        # ЧТО ТЕРЯЕМ, И ЭТО НАЗВАНО. Отрезок `80605fc..ca7dfcd` больше не
        # проверяется. Он зелёный на сегодня, но проверять его перестали —
        # у ключа одна граница, и вычесть из диапазона один коммит нечем.
        #
        # ПОЧЕМУ ЭТО НЕ ПРЯЧЕТ ДОЛГ. Долг объявлен здесь, в `HISTORY.md` и в
        # причине сдвига: миграция идёт от текущей версии, а не от нуля
        # (правило 114). Механизм, из-за которого коммит появился, закрыт
        # изменением #68 — изменение открывает владелец, а не окно.
