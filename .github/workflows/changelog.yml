# Журнал изменений собирается раз в месяц — прогоном, а не памятью.
#
# ЗАЧЕМ. Записи кладутся фрагментами в changelog.d/: два файла с разными
# именами не конфликтуют никогда. Но фрагмент — это ещё не журнал. Сбор был
# задуман «когда накопленное перестанет помещаться в обозримое, решением
# владельца» — и не случился ни разу: за три недели 62 фрагмента, а в
# CHANGELOG.md ни одной строки. Шаг, который держится памятью, механизмом не
# является — тот же вывод, что у стоп-крана (release-hold.yml).
#
# ПОЧЕМУ МЕСЯЦ. Единица истории витрины — месяц: журнал решений HISTORY.md
# ведётся итогами по месяцам, и «что изменилось» ложится рядом с «почему так
# решили» той же нарезкой. Прогон бежит первого числа и собирает фрагменты
# ПРОШЕДШЕГО месяца — месяц берётся по вчерашнему дню. Фрагменты последних
# дней, влитые после сбора, дописываются в тот же раздел следующим прогоном:
# повторный сбор за месяц раздел не дублирует (scripts/collect_changelog.py).
#
# ПОЧЕМУ ИЗМЕНЕНИЕ, А НЕ ПУШ В MAIN. Прямого пути в общую ветку нет ни у кого,
# и этот прогон не исключение. Он пушит машинную ветку токеном владельца —
# событие будит agent-pr, дальше обычный путь: проверки, стоп-кран, автомерж.
# Токен владельца по той же причине, что у суточной пересборки: пуш штатным
# токеном не разбудил бы ни одного прогона.
name: changelog

on:
  schedule:
    # Первое число, минута не :00 — не попадать в общий пик площадки.
    - cron: "37 5 1 * *"
  # У событийной автоматики всегда есть ручная кнопка (правило 104).
  workflow_dispatch:
    inputs:
      month:
        description: "месяц раздела, ГГГГ-ММ; пусто — месяц вчерашнего дня"
        required: false

permissions:
  contents: read

concurrency:
  group: changelog
  # Прогон пушит ветку: отмена посередине оставила бы её без изменения.
  cancel-in-progress: false

jobs:
  collect:
    name: changelog
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Секрет в env, а не в `if` напрямую: контекст `secrets` в условиях шага
      # не гарантирован.
      MERGE_QUEUE_TOKEN: ${{ secrets.MERGE_QUEUE_TOKEN }}
      # копия scripts/checks.py::CHANGELOG_BRANCH — по ней гейты узнают машину;
      # YAML питон не импортирует, меняется вместе с константой (071).
      BRANCH: chore/changelog
      MONTH_INPUT: ${{ inputs.month }}
    steps:
      # Отказ, а не предупреждение: без токена журнал молча не соберётся, и
      # это неотличимо от «фрагментов не было» — ровно то, против чего прогон.
      - name: токен владельца задан
        if: env.MERGE_QUEUE_TOKEN == ''
        run: |
          echo "::error::MERGE_QUEUE_TOKEN не задан — журнал изменений некому довезти до main. Нужен PAT владельца: пуш штатным токеном не разбудит agent-pr."
          exit 1

      - name: Забрать витрину
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Тем же токеном пойдёт пуш ветки — чтобы событие разбудило agent-pr.
          token: ${{ env.MERGE_QUEUE_TOKEN }}
          # ИСТОРИЯ ЦЕЛИКОМ: месяц записи — месяц коммита, добавившего фрагмент.
          # В мелком клоне каждый фрагмент выглядит добавленным верхушкой, и
          # сборщик в нём отказывает, а не угадывает (#257).
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Собрать фрагменты за месяц и довезти пушем ветки
        run: |
          set -euo pipefail
          month="${MONTH_INPUT:-$(date -u -d yesterday +%Y-%m)}"
          # ВЕТКА ЗАВОДИТСЯ ОТ СВЕЖЕГО MAIN КАЖДЫЙ РАЗ. Прошлый сбор слит и
          # удалён площадкой; продолжать его ветку значило бы воскресить её со
          # слитым коммитом — agent-pr такую отвергнет (правило 202).
          git checkout -B "$BRANCH"
          python scripts/collect_changelog.py --collect --month "$month"
          if git diff --quiet -- CHANGELOG.md; then
            echo "::notice::Собирать за $month нечего — журнал не тронут, изменение не нужно. Фрагменты, приехавшие позже, ждут своего месяца."
            exit 0
          fi
          git add -A CHANGELOG.md changelog.d
          # Автор — владелец: коммит принадлежит его проекту. Исполнитель назван
          # трейлером — в итоговой истории видно, что запись составил прогон
          # (правило 123). Тело окончательное: дописывать его некому, и маркер
          # удержания на нём не ставится — стоп-кран узнаёт машину по трейлеру.
          # Имя соавтора — копия scripts/checks.py::PLATFORM_BOT; меняется
          # вместе с константой (071).
          git config user.name "ArtVsMark"
          git config user.email "arvs.markitanov@gmail.com"
          git commit -m "docs(changelog): журнал изменений за $month" \
            -m "Фрагменты changelog.d/ перенесены в CHANGELOG.md раздел месяца и удалены: scripts/collect_changelog.py --collect --month $month. Составил прогон changelog; изменение откроет agent-pr по этому пушу." \
            -m "Co-authored-by: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          git push --force origin "$BRANCH"
