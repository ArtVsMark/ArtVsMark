# СОСТАВ МЕТОК — ДАННЫЕ, А НЕ ДЕЙСТВИЕ В ИНТЕРФЕЙСЕ (правило 064, #345 шаг C).
#
# Применяет .github/labels.yml к площадке: заводит недостающие метки и правит
# цвет и описание объявленных. Метки, которых файл не объявляет, НЕ удаляются:
# снятие метки трогает все задачи разом — это решение человека, а не побочный
# эффект синхронизации; о них говорится предупреждением.
#
# ПРОГОН СКОПИРОВАН с labels-sync.yml Engineering-Pipeline-Mechanisms: у них он
# не вызываемый шаг, а копия (ответ `as-is` без `workflow_call` в их
# .rules/portable.json). Код — `scripts/sync_labels.py` механизмов по коммиту
# выпуска v1.8.0, как в ci-complete.yml, а не копией в дереве витрины.
#
# Зачем витрине: шаг автомержа читает метки `automerge`, `blocker`, `fix-main`,
# `paused/main-red` и `source/0…6` и сверяет их с этим файлом, а agent-pr.yml
# ставит `automerge` при открытии — метка должна существовать на площадке.
name: labels-sync

on:
  push:
    branches: [main]
    paths:
      - ".github/labels.yml"
      - ".github/workflows/labels-sync.yml"
  # У событийной автоматики всегда есть ручная кнопка (правило 104).
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: labels-sync-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  apply:
    name: labels-sync
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Забрать витрину
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Забрать код синхронизации у механизмов
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ArtVsMark/Engineering-Pipeline-Mechanisms
          # Коммит выпуска, а не тег: подвижная метка меняла бы исполняемый
          # код без нашего ведома (152).
          ref: 7cd39af2005ceb7564cba9324a42b375331fa4c8 # v1.8.0
          path: .pipeline-mechanisms
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: поставить разбор состава
        run: python -m pip install --quiet "pyyaml>=6,<7" ./.pipeline-mechanisms/packages/transport

      - name: применить объявленный состав
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -uo pipefail
          rc=0
          said="${RUNNER_TEMP}/labels.txt"
          python .pipeline-mechanisms/scripts/sync_labels.py >"$said" 2>&1 || rc=$?
          cat "$said"
          reason="$(tr '\n' ' ' <"$said")"
          # Зелёными считаются только объявленные коды (068).
          case "$rc" in
            0) ;;
            3)
              echo "::warning::В репозитории есть метки, которых .github/labels.yml не объявляет. Либо вписать их с причиной, либо снять в репозитории: ${reason}"
              ;;
            *)
              echo "::error::Синхронизация меток не отработала (код $rc): ${reason}"
              exit 1
              ;;
          esac
          exit 0
