# ВНЕШНИЙ ВЗГЛЯД — ДРУГОЙ ИСПОЛНИТЕЛЬ, А НЕ ВТОРАЯ ПОПЫТКА (правило 105).
# Второй проход своим же инструментом даёт те же слепые пятна. Ревью ведёт
# ОТДЕЛЬНЫЙ прогон, а не окно, писавшее изменение: у него свой контекст и нет
# истории окна. До 14 октября 105 держалось ролью в .rules/roles.md, а ревизора
# играл владелец; все трое соседей с прогоном ревью держат его машиной.
#
# ОБЯЗАТЕЛЬНОСТЬ — ЖДАТЬ ВЕРДИКТА, А НЕ ЕГО СОДЕРЖАНИЯ. Решение владельца
# 14 октября: слияние ждёт, пока ревью отработает, а находки идут комментариями
# к строкам и красным прогон не делают. Отвергнуто — «находки держат слияние»:
# ложная находка модели останавливала бы изменение до вмешательства человека.
# Держит ожидание release-hold.yml: он будится и этим прогоном и снимает
# стоп-кран, только когда зелены ВСЕ проверки головы, а эта среди них.
# Защиту ветки окно править не может (403), и обязательность от неё не зависит.
#
# ФОРМА ВЗЯТА У ГРЕЙДЕРА, НЕ У КАТАЛОГА (162). Каталог ведёт ревью в «tag mode»
# (`track_progress`), а тот отказывается работать, если файл прогона в изменении
# отличается от файла в main: изменение, правящее прогоны, ревью не получает.
# У витрины такие изменения частые, и цена была бы не «иногда», а «часто».
# Грейдер зовёт плагин code-review без tag mode — так здесь.
#
# ОТДЕЛЬНЫЙ ПРОГОН, А НЕ РАБОТА В «PR check». Тот перезапускается на каждое
# событие метки и отменяет прежний прогон той же головы: ревью внутри него
# отменялось бы снятием `hold` и начиналось заново — пять минут и оплата за
# каждую метку. Здесь событий метки нет.
#
# ТРИГГЕР `pull_request`, А НЕ `pull_request_target`: второй исполняется в
# контексте общей ветки и отдаёт секреты коду постороннего автора. На изменении
# из форка секрета нет — работа пропускается явно, форк ревьюит владелец.
name: review

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  # У событийной автоматики всегда есть ручная кнопка (правило 104).
  workflow_dispatch:
    inputs:
      pr:
        description: "номер изменения"
        required: true

# Голова в имени группы — поколение прогона (179): прогон на старой голове не
# вытеснит прогон на новой.
concurrency:
  group: review-${{ github.event.pull_request.number || inputs.pr }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  issues: read
  # Комментарии пишет приложение Claude по своему токену, выданному через OIDC;
  # прогонному токену права записи не нужны.
  id-token: write

jobs:
  review:
    name: review
    # Без предела зависший агент держал бы слот шесть часов (100).
    timeout-minutes: 20
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-26.04
    steps:
      - name: Забрать изменение
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      # С МАШИНЫ ВЕРДИКТА НЕ СПРАШИВАЮТ (051). Суточная сборка, сбор журнала и
      # обновления зависимостей решений не несут, а ревью каждого из них —
      # оплата за пересказ чисел. Список машинных веток — один,
      # scripts/checks.py::MACHINE_BRANCHES, а не копия здесь (214).
      - name: Машинная ветка ревью не получает
        id: who
        env:
          HEAD: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          machine=$(python -c 'import os, sys; sys.path.insert(0, "scripts"); import checks; print("yes" if checks.machine_branch(os.environ["HEAD"]) else "no")')
          echo "machine=$machine" >> "$GITHUB_OUTPUT"
          if [ "$machine" = yes ]; then
            echo "::notice::$HEAD — машинная ветка, ревью не требуется (051)"
          fi

      # КЛЮЧА НЕТ — ПРОГОН КРАСНЫЙ, А НЕ ЗЕЛЁНЫЙ. У каталога здесь громкий
      # пропуск: там ревью необязательно. У витрины слияние ждёт вердикта, и
      # пропуск без ключа читался бы как «вердикт есть» — зелёное вокруг
      # несостоявшегося (075). Секрет заводит владелец.
      - name: Ключ ревью на месте
        if: steps.who.outputs.machine == 'no'
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "${TOKEN:-}" ]; then
            echo "::error::ревью не состоялось: секрет CLAUDE_CODE_OAUTH_TOKEN не задан — его заводит владелец"
            exit 1
          fi

      # НЕДОВЕРЕННЫЙ ВХОД, И ИЗОЛЯЦИИ НЕТ — ЭТО ПРИЗНАНО ВСЛУХ (085). Ревьюер
      # читает дифф, тело и комментарии изменения — текст того, кого проверяет,
      # — и отличить в нём данные от указаний ему нечем: структурной границы
      # площадка не даёт, а промпт здесь — команда плагина, без своего абзаца.
      # УЩЕРБ ОЦЕНЁН. Худшее, что даёт инъекция, — ревью без находок или с
      # ложными: права работы — только чтение, ответ модели — комментарий для
      # человека, он не исполняется и в код не подставляется, а слияние ждёт
      # ФАКТА вердикта, не его содержания. Изменения из форков сюда не доходят
      # (`if` выше), то есть пишущий дифф — владелец или его окно.
      # УСЛОВИЕ ПЕРЕСМОТРА: как только находки начнут держать слияние, ревью
      # получит права записи или пойдёт по `pull_request_target`, компромисс
      # недопустим — сначала изоляция, потом такая правка.
      - name: Внешний взгляд
        if: steps.who.outputs.machine == 'no'
        uses: anthropics/claude-code-action@ed670b4cf9de2a5a570d130d2f6197b9e543cd64 # v1.0.240
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Маркетплейс плагинов плавающий: `plugin_marketplaces` принимает
          # только адрес репозитория, без ревизии. Остаточный риск принят, как
          # у грейдера: это репозиторий того же поставщика, что и действие, а
          # права работы — только чтение.
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          # Толчок из окна приходит от приложения claude: без этой строки ревью
          # отказывалось работать на каждом `synchronize` из окна (грейдер,
          # #1272). Список именной, а не `*`.
          allowed_bots: 'claude'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number || inputs.pr }}'
