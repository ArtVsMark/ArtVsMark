# ВНЕШНИЙ ВЗГЛЯД — ДРУГОЙ ИСПОЛНИТЕЛЬ, А НЕ ВТОРАЯ ПОПЫТКА (правило 105).
# Второй проход своим же инструментом даёт те же слепые пятна. Ревью ведёт
# ОТДЕЛЬНЫЙ прогон, а не окно, писавшее изменение: у него свой контекст и нет
# истории окна.
#
# ТОНКИЙ ВЫЗОВ ОБЩЕГО ШАГА МЕХАНИЗМОВ (#345, шаг B). Взгляд, реестр находок,
# верификатор и поздний взгляд — `step-review.yml` Engineering-Pipeline-Mechanisms;
# здесь только то, что решает витрина: когда звать и кого не звать. Прежний
# свой прогон (плагин code-review, форма грейдера) снят: он отработал на #346
# зелёным без следа ревью — три хода агента, ни комментария, ни аннотации, — и
# «вердикт есть» там предполагался, а не проверялся (075). У шага механизмов
# вердикт — строка `ВЕРДИКТ: находок N`, а находки ложатся в реестр.
#
# Что и откуда берётся у потребителя: данные шага — `.rules/review-roles.json`,
# `docs/agent/review.md` (раздел «Что держит проект»), профили ролей в
# `docs/agent/roles.md`. Механизм читает их с ОБЩЕЙ ветки, а не с головы
# изменения (085): правка данных действует со следующего изменения.
#
# ОБЯЗАТЕЛЬНОСТЬ — ЖДАТЬ ВЕРДИКТА, А НЕ ЕГО СОДЕРЖАНИЯ. Решение владельца
# 14 октября сохраняется: release-hold.yml будится этим прогоном (имя `review`
# не меняется) и снимает стоп-кран, только когда зелены ВСЕ проверки головы, а
# `review / review` среди них. В .pipeline.yml записи взгляда — `advisory`:
# взгляд механизмов ждёт зелёного `ci-complete` (look_waits.py), и `required`
# здесь дал бы взаимное ожидание.
#
# ИЗМЕНЕНИЕ, ПРАВЯЩЕЕ ЭТОТ ФАЙЛ, ПОЛНОЦЕННОГО ВЗГЛЯДА МОЖЕТ НЕ ПОЛУЧИТЬ: действие
# агента сверяет файл прогона с main. Предел назван у механизмов
# (docs/agent/review.md там же); здесь его держит чтение владельцем.
#
# ТРИГГЕР `pull_request`, А НЕ `pull_request_target`: второй исполняется в
# контексте общей ветки и отдаёт секреты коду постороннего автора. Форк шаг
# пропускает явно, форк ревьюит владелец.
name: review
# Имя запуска верификатора — «verify <отпечаток>»: по нему шаг узнаёт, на какую
# находку верификатор уже звался. Прочие запуски — заголовком изменения.
run-name: ${{ inputs.mark && format('verify {0}', inputs.mark) || github.event.pull_request.title || github.workflow }}

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  # Обход реестра и поздний взгляд по слитому идут сами (`sweep`, `late-queue`).
  # `workflow_run [ci]`, как у механизмов, не взят: у витрины нет прогона `ci`
  # на `main`, уборку реестра везёт то же расписание.
  # Расписание событие не страхует (169): у него свой предмет — слитое и реестр,
  # а не изменение. Потерянное событие `pull_request` оно не подхватит: взгляд
  # на изменение зовётся только событием и кнопкой.
  schedule:
    - cron: "17 8 * * *"
  # У событийной автоматики всегда есть ручная кнопка (правило 104).
  workflow_dispatch:
    inputs:
      pr:
        description: "номер СЛИТОГО изменения; пусто — взять очередь из реестра"
        required: false
        type: string
      mark:
        description: "отпечаток находки из реестра находок — проверить её премису; пусто — не проверять"
        required: false
        type: string

# Голова в имени группы — поколение прогона (179). У проверки премисы группа
# своя на запуск: второе нажатие не снимает уже оплаченный ответ.
concurrency:
  group: review-${{ github.event.pull_request.number || inputs.pr || inputs.mark || github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}${{ inputs.mark && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true

# Права вызванного прогона не шире прав вызывающего: здесь их потолок для шага.
permissions:
  contents: read
  # Взгляд ждёт вердикта сводного гейта на голове — его запись читается.
  checks: read
  pull-requests: write
  # Задача-реестр находок заводится и обновляется шагом.
  issues: write
  id-token: write
  # Чтение прогонов — джобу карты.
  actions: read

jobs:
  # Код шага берётся по коммиту выпуска v1.6.0, а не по тегу и не `./`:
  # `check_mechanisms.py::pinned_actions` требует SHA (тот же коммит, что у
  # ci-complete.yml). Ключ — по имени, а не `secrets: inherit`.
  #
  # С МАШИНЫ ВЕРДИКТА НЕ СПРАШИВАЮТ (051). Суточная сборка, сбор журнала и
  # обновления зависимостей решений не несут, а взгляд каждого — оплата за
  # пересказ чисел. С v1.6.0 это вход шага `skip-branches` (просила витрина,
  # Engineering-Pipeline-Mechanisms#1342) вместо своей работы `who`, гасившей
  # вызов: взгляд и реестр находок на таких ветках не зовутся, пропуск назван
  # строкой в сводке. Приставки — КОПИЯ scripts/checks.py::MACHINE_BRANCHES:
  # YAML питон не импортирует; совпадение держит
  # scripts/check_mechanisms.py::skip_branches_match (214). Та же строка
  # передаётся шагу автомержа — реестр непросмотренного их не берёт.
  #
  # ПРЕДЕЛ НАЗВАН. Вход на `pull_request` берётся из файла прогона в
  # изменении, а `who` читал список с общей ветки. Изменение, правящее этот
  # файл, взгляда и так не получает (действие сверяет файл с main), а
  # реестр непросмотренного его берёт — новой дыры переезд не открывает.
  review:
    uses: ArtVsMark/Engineering-Pipeline-Mechanisms/.github/workflows/step-review.yml@817255779cdd01caeeb01a3f804fa145c9e1217d # v1.6.0
    with:
      pr: ${{ inputs.pr || '' }}
      mark: ${{ inputs.mark || '' }}
      skip-branches: "dependabot/ chore/metrics chore/deps- chore/changelog"
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
