# Пересобирает цифры витрины из живых источников.
#
# Повод: релиз v1.11.0 вышел через четыре часа после того, как в README было
# вписано «11 releases shipped». Числа, вписанные руками, устаревают молча —
# поэтому они измеряются, а не запоминаются.
#
# Грейдер публичный, поэтому штатного GITHUB_TOKEN хватает: workflow читает его
# API и клонирует рабочее дерево напрямую. Каталог правил не клонируется вовсе —
# его число берётся из машиночитаемого экспорта одной HTTP-загрузкой.
name: Profile metrics

on:
  schedule:
    # Раз в сутки; минута не :00, чтобы не попадать в общий пик.
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: metrics
  # Джоба коммитит и пушит: отмена между `commit` и `push` оставила бы коммит,
  # которого никто не увидит, и следующий прогон начал бы с расхождения.
  # Пересборка идёт секунды, ждать её дешевле, чем разбирать такое состояние.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Без этого действует умолчание GitHub в шесть часов.
    timeout-minutes: 10
    steps:
      - name: Забрать витрину
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Забрать грейдер (только рабочее дерево)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ArtVsMark/Stepik-Python-Grader
          path: grader
          fetch-depth: 1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Пересобрать метрики
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build_metrics.py grader

      - name: Закоммитить, если числа изменились
        run: |
          set -euo pipefail
          if git diff --quiet -- README.md assets .rules; then
            echo "Числа не изменились — коммит не нужен."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets .rules
          git commit -m "chore(profile): пересобранные метрики витрины [skip ci]"
          # Между checkout и push мог уехать мерж PR: без rebase пуш отлетит,
          # и витрина пропустит сутки до следующего расписания.
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
