# Пересобирает цифры витрины из живых источников.
#
# Повод: релиз v1.11.0 вышел через четыре часа после того, как в README было
# вписано «11 releases shipped». Числа, вписанные руками, устаревают молча —
# поэтому они измеряются, а не запоминаются.
#
# Грейдер публичный, поэтому штатного GITHUB_TOKEN хватает: workflow читает его
# API и клонирует рабочее дерево напрямую. Каталог правил не клонируется вовсе —
# его число берётся из машиночитаемого экспорта одной HTTP-загрузкой.
#
# ПОЧЕМУ ИЗМЕНЕНИЕ, А НЕ ПРЯМОЙ ПУШ. Прежняя редакция коммитила прямо в `main`.
# Пока `main` ничем не защищён, это работает — и ровно поэтому обязательную
# проверку на него нельзя было поставить: она отбила бы этот push. Витрина при
# этом рассказывает читателю, что качество держат гейты, а не соглашения, —
# значит единственный прямой путь в общую ветку надо убрать, а не выписывать
# ему пропуск. Пропуск в списке обходов и есть та дыра, которую страница
# обещает не иметь.
#
# ПОЧЕМУ ТОКЕН ВЛАДЕЛЬЦА, А НЕ ШТАТНЫЙ. Событие, порождённое `GITHUB_TOKEN`,
# **не запускает другие прогоны** — это защита площадки от зацикливания.
# Изменение, открытое штатным токеном, не получило бы ни одной проверки, а
# пустой список проверок наш же автомерж читает как «не стартовало» и не
# сливает никогда. То есть числа замерли бы молча — ровно то, против чего вся
# эта сборка. Тот же секрет, что у слияния: `MERGE_QUEUE_TOKEN`.
#
# ПОЧЕМУ ОДНА ВЕТКА, А НЕ ПО ВЕТКЕ В СУТКИ. Ветка `chore/metrics` переписывается
# каждым прогоном, и изменение обновляется на месте. Иначе за месяц накопится
# тридцать веток и тридцать изменений с одинаковым заголовком.
name: Profile metrics

on:
  schedule:
    # Раз в сутки; минута не :00, чтобы не попадать в общий пик.
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: metrics
  # Джоба пушит ветку и открывает изменение: отмена посередине оставила бы
  # ветку без изменения, и следующий прогон начал бы с расхождения.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Без этого действует умолчание GitHub в шесть часов.
    timeout-minutes: 10
    env:
      # Секрет кладётся в env, а не читается в `if` напрямую: контекст
      # `secrets` в условиях шага не гарантирован.
      MERGE_QUEUE_TOKEN: ${{ secrets.MERGE_QUEUE_TOKEN }}
      BRANCH: chore/metrics
    steps:
      # Без токена владельца сборка не может довезти числа до витрины. Это
      # отказ, а не предупреждение: страница молча замрёт на вчерашних
      # значениях, и снаружи это неотличимо от «числа не менялись».
      - name: токен владельца задан
        if: env.MERGE_QUEUE_TOKEN == ''
        run: |
          echo "::error::MERGE_QUEUE_TOKEN не задан — числа витрины некому довезти до main. Нужен PAT владельца с правами contents:write и pull-requests:write. GITHUB_TOKEN не подходит: открытое им изменение не получает проверок, и автомерж его не возьмёт."
          exit 1

      - name: Забрать витрину
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Тем же токеном пойдёт push ветки: пуш штатным токеном не разбудил бы
          # проверку изменения (см. врезку выше).
          token: ${{ env.MERGE_QUEUE_TOKEN }}

      - name: Забрать грейдер (только рабочее дерево)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ArtVsMark/Stepik-Python-Grader
          path: grader
          fetch-depth: 1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Пересобрать метрики
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build_metrics.py grader

      # Токена площадки у шага больше нет: `gh` он не зовёт, а лишний секрет в
      # окружении — это расширение доверия без предмета. Пуш идёт учётными
      # данными, которые положил checkout выше.
      - name: Довезти числа пушем ветки, если они изменились
        run: |
          set -euo pipefail
          # ДАТА САМА ПО СЕБЕ ИЗМЕНЕНИЕМ НЕ СЧИТАЕТСЯ. Подпись «data as of»
          # пишется каждой сборкой, и без этой оговорки прогон открывал бы
          # изменение ЕЖЕДНЕВНО — даже когда ни одно число не сдвинулось. Тогда
          # «числа изменились» перестало бы что-либо значить, а очередь
          # изменений превратилась бы в фон.
          #
          # Отсюда и смысл подписи: это день, когда числа последний раз
          # ИЗМЕНИЛИСЬ, а не когда сборка бежала. Второе спрашивает
          # .github/workflows/staleness.yml.
          changed=$(git diff -U0 -- README.md assets .rules \
            | grep -E '^[+-]' | grep -Ev '^(\+\+\+|---)' | grep -v 'data as of' || true)
          if [ -z "$changed" ]; then
            echo "Числа не изменились — изменение не нужно."
            git checkout -- README.md assets .rules
            exit 0
          fi

          # Автор коммита — ВЛАДЕЛЕЦ, а не исполнитель. Здесь стоял бот
          # площадки, и это выглядело честнее: числа считает прогон. Цена
          # выяснилась 28 августа — красное на attribution-history.
          #
          # МЕХАНИКА. Изменение открывает владелец (open-pr.yml), а коммиты
          # ветки были подписаны ботом. Расхождение автора изменения и автора
          # коммитов площадка чинит по-своему: дописывает `Co-authored-by:
          # github-actions[bot]` в squash-коммит. Соавтора нет в
          # .github/authors.txt — и гейт покраснел справедливо.
          #
          # ПОЧЕМУ НЕ ДОБАВИТЬ БОТА В СПИСОК. Он перестал бы быть соавтором в
          # тот же миг: после этой правки бот больше не подписывает ничего, и
          # имя в списке устарело бы сразу. Список заведён против расхождения
          # написаний, а не как место, куда складывают всё, что покраснело.
          git config user.name "ArtVsMark"
          git config user.email "arvs.markitanov@gmail.com"
          git checkout -B "$BRANCH"
          git add README.md assets .rules
          # `[skip ci]` здесь был бы вредом: изменению нужна проверка, иначе
          # автомерж прочитает пустой список как «не стартовало».
          # ИСПОЛНИТЕЛЬ НАЗВАН ТРЕЙЛЕРОМ, И ЭТО НЕ ЗАТЫКАНИЕ ГЕЙТА. Автором
          # стоит владелец — коммит принадлежит его проекту и он за него
          # отвечает; составил же его прогон, и в итоговой истории это должно
          # быть видно (правило 123).
          #
          # ПОЧЕМУ ЭТО ПОНАДОБИЛОСЬ ИМЕННО ТЕПЕРЬ. До #83 коммиты ветки
          # подписывал бот площадки, и при уплотнении она сама дописывала
          # `Co-authored-by: github-actions[bot]` — расхождение автора изменения
          # и автора коммитов она чинит так. #83 сделал автором владельца, и
          # расхождение исчезло вместе с соавтором: три суточные пересборки
          # (#91, #93, #94) уехали в общую ветку вовсе без атрибуции и покрасили
          # `attribution-history`. Одна починка сломала соседнее — это видно
          # только в итоговой истории, ради чего гейт первопредков и заведён.
          # ПОЯСНЕНИЕ ЕДЕТ В ТЕЛЕ КОММИТА, А НЕ В ТЕЛЕ ИЗМЕНЕНИЯ. Изменение
          # открывает `open-pr` по пушу этой ветки, и тело он собирает из
          # сообщений коммитов — тем же порядком, каким его потом соберёт
          # squash. Здесь пишется то единственное, чего из диффа не видно:
          # откуда взялись числа и что значит сам факт открытия.
          #
          # Пример маркера намеренно записан словами, а не разметкой: в теле
          # изменения `<!--m:ключ-->` не отображается вовсе, и три пересборки
          # подряд (#91, #93, #94) объясняли читателю, что числа стоят «между
          # маркерами ``».
          git commit -m "chore(profile): пересобранные метрики витрины" \
            -m "Числа здесь не вписаны, а измерены: страницу переписывает scripts/build_metrics.py между парными маркерами вида m:ключ. Изменение открыто — значит хотя бы одно значение разошлось с источником." \
            -m "Составил прогон Profile metrics; изменение откроет open-pr по этому пушу. Тело окончательное: дописывать его некому, и маркер удержания на нём не ставится." \
            -m "Co-authored-by: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"

          # ОТКРЫВАТЕЛЬ У ВЕТКИ ОДИН, И ЭТО НЕ ЭТОТ ПРОГОН. Здесь стояли ещё
          # `gh pr list` и `gh pr create` — вторая дорога к тому же изменению.
          # Работала она на удаче: этот прогон успевал открыть раньше, чем
          # проснётся `open-pr`. 29 августа не успел — `open-pr` простоял в
          # очереди исполнителей 1 м 45 с, за это время изменение #93 успело
          # открыться, провериться и слиться, и опоздавший прогон покраснел на
          # «No commits between main and chore/metrics» (#98).
          #
          # Обратный порядок был не лучше, а хуже и тише: открой `open-pr`
          # первым — пересборка встала бы с меткой `hold`, которую снимают по
          # отсутствию маркера в теле, а маркер он ставил всем подряд.
          #
          # Пуш идёт токеном владельца, поэтому событие будит прогоны: тем же
          # свойством, ради которого этот токен здесь и стоит.
          git push --force origin "$BRANCH"

      # ПРОИЗВОДНОЕ УЕЗЖАЕТ ИЗ ОБЩЕЙ ВЕТКИ (правило 160). Картинки метрик
      # пересобираются каждые сутки, то есть чаще, чем идут изменения: в дереве
      # `main` они дают конфликт на каждом слиянии (#111 — живой случай) и
      # красят ветку сдвигом числа, а не поломкой.
      #
      # Приём взят у соседей, а не изобретён: грейдер публикует значки отдельной
      # веткой `badges`, каталог отвергает артефакт, вернувшийся в дерево.
      # У витрины он уже применён к змейке — ветка `output`, — и там же названа
      # причина: «в main бинарных артефактов не появляется».
      #
      # ВЕТКА ОТДЕЛЬНАЯ ОТ `output`, И ЭТО НЕ ВКУСОВЩИНА. Действие публикации
      # заменяет содержимое ветки целиком: положи метрики в `output` — и змейка
      # исчезнет при первом же прогоне.
      #
      # Шаг стоит ПОСЛЕ пуша ветки: если публикация упадёт, изменение с числами
      # уже открыто, а картинки в дереве пока прежние — ссылки не ломаются.
      - name: Разложить производные картинки для публикации
        run: |
          set -euo pipefail
          mkdir -p dist-assets
          # Только производное: header, typing и divider рисуются руками и
          # живут в дереве — они меняются реже изменений, а не чаще.
          cp assets/metrics-*.svg assets/featured-*.svg assets/tile-*.svg dist-assets/
          ls dist-assets | sed 's/^/  /'

      - name: Опубликовать картинки в ветку assets
        uses: crazy-max/ghaction-github-pages@1d6ee9b181a81033a16bd707a1401afa978daab4 # v5.0.0
        with:
          target_branch: assets
          build_dir: dist-assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
