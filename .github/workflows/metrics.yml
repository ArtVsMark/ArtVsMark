# Пересобирает цифры витрины из живых источников.
#
# Повод: релиз v1.11.0 вышел через четыре часа после того, как в README было
# вписано «11 releases shipped». Числа, вписанные руками, устаревают молча —
# поэтому они измеряются, а не запоминаются.
#
# Грейдер публичный, поэтому штатного GITHUB_TOKEN хватает: workflow читает его
# API и клонирует рабочее дерево напрямую. Каталог правил не клонируется вовсе —
# его число берётся из машиночитаемого экспорта одной HTTP-загрузкой.
#
# ПОЧЕМУ ИЗМЕНЕНИЕ, А НЕ ПРЯМОЙ ПУШ. Прежняя редакция коммитила прямо в `main`.
# Пока `main` ничем не защищён, это работает — и ровно поэтому обязательную
# проверку на него нельзя было поставить: она отбила бы этот push. Витрина при
# этом рассказывает читателю, что качество держат гейты, а не соглашения, —
# значит единственный прямой путь в общую ветку надо убрать, а не выписывать
# ему пропуск. Пропуск в списке обходов и есть та дыра, которую страница
# обещает не иметь.
#
# ПОЧЕМУ ТОКЕН ВЛАДЕЛЬЦА, А НЕ ШТАТНЫЙ. Событие, порождённое `GITHUB_TOKEN`,
# **не запускает другие прогоны** — это защита площадки от зацикливания.
# Изменение, открытое штатным токеном, не получило бы ни одной проверки, а
# пустой список проверок наш же автомерж читает как «не стартовало» и не
# сливает никогда. То есть числа замерли бы молча — ровно то, против чего вся
# эта сборка. Тот же секрет, что у слияния: `MERGE_QUEUE_TOKEN`.
#
# ПОЧЕМУ ОДНА ВЕТКА, А НЕ ПО ВЕТКЕ В СУТКИ. Ветка `chore/metrics` переписывается
# каждым прогоном, и изменение обновляется на месте. Иначе за месяц накопится
# тридцать веток и тридцать изменений с одинаковым заголовком.
name: Profile metrics

on:
  schedule:
    # Раз в сутки; минута не :00, чтобы не попадать в общий пик.
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: metrics
  # Джоба пушит ветку и открывает изменение: отмена посередине оставила бы
  # ветку без изменения, и следующий прогон начал бы с расхождения.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-26.04
    # Без этого действует умолчание GitHub в шесть часов.
    timeout-minutes: 10
    # ПРАВА ПОДНЯТЫ РАДИ ОДНОГО ШАГА — публикации картинок в ветку `assets`.
    # Действие публикации пушит ШТАТНЫМ токеном, а у прогона стоял
    # `contents: read`. Первый же живой запуск ответил отказом:
    #
    #     remote: Permission to ArtVsMark/ArtVsMark.git denied to
    #     github-actions[bot]  →  403, exit code 128
    #
    # Прочие шаги правами прогона не пользуются: ветку с числами пушат учётные
    # данные владельца, положенные checkout ниже.
    #
    # ПОЧЕМУ НЕ ТОКЕН ВЛАДЕЛЬЦА, КАК У ПУША ВЕТКИ. Ровно из-за свойства, ради
    # которого он там стоит: его пуш БУДИТ прогоны. Публикация в `assets` не
    # должна будить никого — разбуженный `agent-pr` открыл бы изменение из ветки
    # с картинками в main, то есть вернул бы производное в дерево, против того
    # самого правила 160. Штатный токен событий не порождает, и здесь это не
    # ограничение, а нужное свойство. Тот же выбор у змейки (snake.yml).
    permissions:
      contents: write
    env:
      # Секрет кладётся в env, а не читается в `if` напрямую: контекст
      # `secrets` в условиях шага не гарантирован.
      MERGE_QUEUE_TOKEN: ${{ secrets.MERGE_QUEUE_TOKEN }}
      # копия scripts/checks.py::METRICS_BRANCH — по ней гейты узнают машину;
      # YAML питон не импортирует, меняется вместе с константой (071).
      BRANCH: chore/metrics
    steps:
      # Без токена владельца сборка не может довезти числа до витрины. Это
      # отказ, а не предупреждение: страница молча замрёт на вчерашних
      # значениях, и снаружи это неотличимо от «числа не менялись».
      - name: токен владельца задан
        if: env.MERGE_QUEUE_TOKEN == ''
        run: |
          echo "::error::MERGE_QUEUE_TOKEN не задан — числа витрины некому довезти до main. Нужен PAT владельца с правами contents:write и pull-requests:write. GITHUB_TOKEN не подходит: открытое им изменение не получает проверок, и автомерж его не возьмёт."
          exit 1

      - name: Забрать витрину
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Тем же токеном пойдёт push ветки: пуш штатным токеном не разбудил бы
          # проверку изменения (см. врезку выше).
          token: ${{ env.MERGE_QUEUE_TOKEN }}

      # ЧЕКАУТА ГРЕЙДЕРА ЗДЕСЬ БОЛЬШЕ НЕТ. Он стоял ради трёх чисел: тестов,
      # тест-модулей и экспериментальных версий Python — то есть ради подсчётов
      # по чужому дереву и разбора чужого ci.yml. Грейдер публикует их сам
      # (facts.json в ветке badges, его PR #1411), и витрина их читает.
      # Клонировать репозиторий целиком ради двух цифр больше незачем.

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Пересобрать метрики
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build_metrics.py

      # Токена площадки у шага больше нет: `gh` он не зовёт, а лишний секрет в
      # окружении — это расширение доверия без предмета. Пуш идёт учётными
      # данными, которые положил checkout выше.
      - name: Довезти числа пушем ветки, если они изменились
        run: |
          set -euo pipefail
          # ДАТА САМА ПО СЕБЕ ИЗМЕНЕНИЕМ НЕ СЧИТАЕТСЯ. Подпись «data as of»
          # пишется каждой сборкой, и без этой оговорки прогон открывал бы
          # изменение ЕЖЕДНЕВНО — даже когда ни одно число не сдвинулось. Тогда
          # «числа изменились» перестало бы что-либо значить, а очередь
          # изменений превратилась бы в фон.
          #
          # Отсюда и смысл подписи: это день, когда числа последний раз
          # ИЗМЕНИЛИСЬ, а не когда сборка бежала. Второе спрашивает
          # .github/workflows/staleness.yml.
          #
          # `assets` В СПИСКЕ ОСТАЁТСЯ, ХОТЯ ПРОИЗВОДНЫЕ ТУДА БОЛЬШЕ НЕ ПОПАДАЮТ.
          # Они игнорируются (.gitignore, правило 160), и ни diff, ни add их не
          # видят — но в дереве остались рукодельные: шапка, печатающаяся строка,
          # разделитель. Убери путь — и их правка перестала бы доезжать молча.
          # «data as of» — копия подписи, которую печатает scripts/build_metrics.py::
          # render_projects; поменяют подпись — меняется и этот фильтр (071).
          changed=$(git diff -U0 -- README.md assets .rules \
            | grep -E '^[+-]' | grep -Ev '^(\+\+\+|---)' | grep -v 'data as of' || true)
          if [ -z "$changed" ]; then
            echo "Числа не изменились — изменение не нужно."
            git checkout -- README.md assets .rules
            exit 0
          fi

          # Автор коммита — ВЛАДЕЛЕЦ, а не исполнитель. Здесь стоял бот
          # площадки, и это выглядело честнее: числа считает прогон. Цена
          # выяснилась 28 августа — красное на attribution-history.
          #
          # МЕХАНИКА. Изменение открывает владелец (agent-pr.yml), а коммиты
          # ветки были подписаны ботом. Расхождение автора изменения и автора
          # коммитов площадка чинит по-своему: дописывает `Co-authored-by:
          # github-actions[bot]` в squash-коммит. Соавтора нет в
          # .github/authors.txt — и гейт покраснел справедливо.
          #
          # ПОЧЕМУ НЕ ДОБАВИТЬ БОТА В СПИСОК. Он перестал бы быть соавтором в
          # тот же миг: после этой правки бот больше не подписывает ничего, и
          # имя в списке устарело бы сразу. Список заведён против расхождения
          # написаний, а не как место, куда складывают всё, что покраснело.
          git config user.name "ArtVsMark"
          git config user.email "arvs.markitanov@gmail.com"
          git checkout -B "$BRANCH"
          # ОТВЕТ КАТАЛОГУ БОЛЬШЕ НЕ ВЕЗЁТ МАШИНА. Сборка дописывает новые
          # правила со статусом `unreviewed`, и раньше эта правка ехала в общую
          # ветку суточным коммитом. Но `.rules/bindings.json` — это ВЕРДИКТЫ,
          # то есть решения, а решений машина не принимает: регистрация правила
          # без разбора выглядит в истории как ответ, которого никто не давал.
          # Теперь дописывание живёт только в прогоне: число «без ответа»
          # печатает заслон долга, и закрывает его окно — тем же заходом, что
          # и разбирает (177).
          #
          # Картинки идут в отдельную ветку `assets`, README остаётся здесь:
          # его показывает профиль, и унести его из общей ветки нельзя (160).
          git add README.md assets
          # `[skip ci]` здесь был бы вредом: изменению нужна проверка, иначе
          # автомерж прочитает пустой список как «не стартовало».
          # ИСПОЛНИТЕЛЬ НАЗВАН ТРЕЙЛЕРОМ, И ЭТО НЕ ЗАТЫКАНИЕ ГЕЙТА. Автором
          # стоит владелец — коммит принадлежит его проекту и он за него
          # отвечает; составил же его прогон, и в итоговой истории это должно
          # быть видно (правило 123).
          #
          # ПОЧЕМУ ЭТО ПОНАДОБИЛОСЬ ИМЕННО ТЕПЕРЬ. До #83 коммиты ветки
          # подписывал бот площадки, и при уплотнении она сама дописывала
          # `Co-authored-by: github-actions[bot]` — расхождение автора изменения
          # и автора коммитов она чинит так. #83 сделал автором владельца, и
          # расхождение исчезло вместе с соавтором: три суточные пересборки
          # (#91, #93, #94) уехали в общую ветку вовсе без атрибуции и покрасили
          # `attribution-history`. Одна починка сломала соседнее — это видно
          # только в итоговой истории, ради чего гейт первопредков и заведён.
          # ПОЯСНЕНИЕ ЕДЕТ В ТЕЛЕ КОММИТА, А НЕ В ТЕЛЕ ИЗМЕНЕНИЯ. Изменение
          # открывает `agent-pr` по пушу этой ветки, и тело он собирает из
          # сообщений коммитов — тем же порядком, каким его потом соберёт
          # squash. Здесь пишется то единственное, чего из диффа не видно:
          # откуда взялись числа и что значит сам факт открытия.
          #
          # Пример маркера намеренно записан словами, а не разметкой: в теле
          # изменения `<!--m:ключ-->` не отображается вовсе, и три пересборки
          # подряд (#91, #93, #94) объясняли читателю, что числа стоят «между
          # маркерами ``».
          # Имя соавтора в последней строке — копия scripts/checks.py::PLATFORM_BOT:
          # по нему стоп-кран узнаёт машину и не ставит маркер; меняется вместе с
          # константой (071).
          git commit -m "chore(profile): пересобранные метрики витрины" \
            -m "Числа здесь не вписаны, а измерены: страницу переписывает scripts/build_metrics.py между парными маркерами вида m:ключ. Изменение открыто — значит хотя бы одно значение разошлось с источником." \
            -m "Составил прогон Profile metrics; изменение откроет agent-pr по этому пушу. Тело окончательное: дописывать его некому, и маркер удержания на нём не ставится." \
            -m "Co-authored-by: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"

          # ОТКРЫВАТЕЛЬ У ВЕТКИ ОДИН, И ЭТО НЕ ЭТОТ ПРОГОН. Здесь стояли ещё
          # `gh pr list` и `gh pr create` — вторая дорога к тому же изменению.
          # Работала она на удаче: этот прогон успевал открыть раньше, чем
          # проснётся `agent-pr`. 29 августа не успел — `agent-pr` простоял в
          # очереди исполнителей 1 м 45 с, за это время изменение #93 успело
          # открыться, провериться и слиться, и опоздавший прогон покраснел на
          # «No commits between main and chore/metrics» (#98).
          #
          # Обратный порядок был не лучше, а хуже и тише: открой `agent-pr`
          # первым — пересборка встала бы с меткой `hold`, которую снимают по
          # отсутствию маркера в теле, а маркер он ставил всем подряд.
          #
          # Пуш идёт токеном владельца, поэтому событие будит прогоны: тем же
          # свойством, ради которого этот токен здесь и стоит.
          git push --force origin "$BRANCH"

      # ПРОИЗВОДНОЕ УЕЗЖАЕТ ИЗ ОБЩЕЙ ВЕТКИ (правило 160). Картинки метрик
      # пересобираются каждые сутки, то есть чаще, чем идут изменения: в дереве
      # `main` они дают конфликт на каждом слиянии (#111 — живой случай) и
      # красят ветку сдвигом числа, а не поломкой.
      #
      # Приём взят у соседей, а не изобретён: грейдер публикует значки отдельной
      # веткой `badges`, каталог отвергает артефакт, вернувшийся в дерево.
      # У витрины он уже применён к змейке — ветка `output`, — и там же названа
      # причина: «в main бинарных артефактов не появляется».
      #
      # ВЕТКА ОТДЕЛЬНАЯ ОТ `output`, И ЭТО НЕ ВКУСОВЩИНА. Действие публикации
      # заменяет содержимое ветки целиком: положи метрики в `output` — и змейка
      # исчезнет при первом же прогоне.
      #
      # Шаг стоит ПОСЛЕ пуша ветки: если публикация упадёт, изменение с числами
      # уже открыто, а картинки в дереве пока прежние — ссылки не ломаются.
      - name: Разложить производные картинки для публикации
        run: |
          set -euo pipefail
          mkdir -p dist-assets
          # Только производное: header, typing и divider рисуются руками и
          # живут в дереве — они меняются реже изменений, а не чаще.
          #
          # КОПИРУЕТСЯ ТО, ЧТО ЕСТЬ, — И ЭТО ПРО ОТКАЗ, А НЕ ПРО АККУРАТНОСТЬ.
          # Источник профильных картинок — `/users/*` и GraphQL; отказ там
          # третий исход, и сборка их тогда не рисует вовсе, оставляя прежние
          # лежать в ветке. Но так же выглядит и картинка, которую сборка
          # ПЕРЕСТАЛА рисовать: плитка флагмана ушла с витрины, `cp` по её
          # образцу упал, и вместе с ним встала ВСЯ публикация — на сутки, при
          # исправных источниках и зелёной сборке.
          #
          # Поэтому список один и правило одно: нет файла — нет копии, а не
          # отказ. Пропавшую картинку ловит гейт следов в сборке, а не `cp`,
          # которому нечего сказать, кроме «No such file».
          #
          # `if`, а не `[ -e ] && cp`: при `set -e` последний виток цикла с
          # ложным условием возвращает единицу и роняет шаг — тем же молчаливым
          # способом.
          for card in assets/featured-*.svg assets/tile-*.svg \
                      assets/engineering-*.svg assets/activity-*.svg \
                      assets/stack-*.svg; do
            if [ -e "$card" ]; then cp "$card" dist-assets/; fi
          done
          # Пустая раскладка — это отказ: публиковать нечего, и молча выкладывать
          # пустоту значило бы стереть витрину.
          if [ -z "$(ls -A dist-assets)" ]; then
            echo "::error::раскладка пуста — сборка не нарисовала ни одной картинки"
            exit 1
          fi
          ls dist-assets | sed 's/^/  /'

      - name: Опубликовать картинки в ветку assets
        uses: crazy-max/ghaction-github-pages@1d6ee9b181a81033a16bd707a1401afa978daab4 # v5.0.0
        with:
          target_branch: assets
          build_dir: dist-assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # КТО ИЗ СОСЕДЕЙ ДОГОВОРУ ФАКТОВ НЕ ОТВЕЧАЕТ — КАЖДЫЕ СУТКИ, ВСЛУХ.
  #
  # Договор с 15.10 держит каталог (facts-v2.0.0, #843), а витрина — его
  # читатель: «факты соседей читает их читатель, а не каталог» (их
  # check_facts.py без --file). Поэтому сверка осталась здесь, но кодом
  # каталога, а не своей копией: своя схема знала только мажор 1, и файл 2.0
  # получал «schema не той формы» (#358). Своя копия уходит из дерева в #353.
  #
  # ОТДЕЛЬНОЙ РАБОТОЙ И ТОЛЬКО С ЧТЕНИЕМ. Код берётся с выпуска каталога, а
  # работа `build` пишет в ветку: чужой код в ней получил бы право записи.
  # Тег выпуска подвижен, поэтому каждый скачанный файл сверяется с
  # закреплённым отпечатком — закрепление вызываемого без вызывающего не
  # защищает ни от чего (152). Подъём договора — правка тега и трёх
  # отпечатков здесь, одним изменением.
  #
  # Предупреждением, а не красным: расхождение чинит издатель у себя, и чужая
  # правка не вправе останавливать наши числа (039). Красный — только третий
  # исход: код договора не получен или проверка не отработала.
  facts:
    name: facts
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      FACTS_CONTRACT: facts-v2.0.0
    steps:
      - name: Забрать список соседей
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          sparse-checkout: projects.json
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Забрать код договора у каталога и сверить отпечатки
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/facts-contract"
          mkdir -p "$dir"
          for f in check_facts.py facts.schema.json facts.version; do
            curl -fsSL -o "$dir/$f" \
              "https://github.com/ArtVsMark/Engineering-Incidents-Playbook/releases/download/$FACTS_CONTRACT/$f"
          done
          ( cd "$dir" && sha256sum --check --strict - <<'SUMS'
          49e4e8980cc4c01269239cb84e892625f11995db2243d3a56d5f899c1e9edb8b  check_facts.py
          e00775d563eb7ed96ff230ecadb56f6ab38232b5da0d6a4fdb74fafafa6434ea  facts.schema.json
          c28fcca53637bc88e124af1725df13cb98c69dedefd62fb3cdbe1cdb6b760624  facts.version
          SUMS
          ) || { echo "::error::Код договора фактов $FACTS_CONTRACT не совпал с закреплённым отпечатком — тег выпуска сдвинули; сверка не запускается (152)"; exit 1; }

      - name: Сверить факты соседей с договором
        run: |
          set -uo pipefail
          dir="$RUNNER_TEMP/facts-contract"
          repos=$(python -I -c 'import json; print("\n".join(p["repo"] for p in json.load(open("projects.json"))["projects"]))')
          silent=() ; off=() ; broken=()
          # ТРИ ИСХОДА НА КАЖДЫЙ ФАЙЛ, А НЕ ДВА (039): 200 — читаем; 404 — файла
          # нет, это ответ издателя («не публикует»), а не наш сбой; всё прочее —
          # площадка не ответила. `curl -f` смешивал 404 с обрывом связи.
          fetch() {  # fetch <адрес> <куда> → печатает код ответа, 000 — нет связи
            curl -sS -L -o "$2" -w '%{http_code}' "$1" 2>/dev/null || true
          }
          for repo in $repos; do
            work="$RUNNER_TEMP/facts/$repo"
            mkdir -p "$work"
            base="https://raw.githubusercontent.com/$repo/badges/.github/badges"
            code=$(fetch "$base/facts.json" "$work/facts.json")
            case "$code" in
              200) ;;
              404) echo "== $repo"; echo "  • facts.json нет в ветке badges — издатель не публикует факты"
                   off+=("$repo"); continue ;;
              *) silent+=("$repo"); continue ;;
            esac
            echo "== $repo"
            # Манифест семьи необязателен: нет — проверка советует, а не отказывает.
            # Не JSON — это ФОРМА у издателя, а не наше молчание: называется
            # расхождением, и проверка идёт без манифеста.
            manifest=()
            code=$(fetch "$base/contracts.json" "$work/contracts.json")
            case "$code" in
              200)
                if python -I -c 'import json, sys; json.load(open(sys.argv[1], encoding="utf-8"))' "$work/contracts.json" 2>/dev/null; then
                  manifest=(--manifest "$work/contracts.json")
                else
                  echo "  • contracts.json не разбирается как JSON — форма манифеста у издателя"
                  off+=("$repo")
                  manifest=(--manifest "$work/absent.json")
                fi ;;
              404) manifest=(--manifest "$work/absent.json") ;;
              *) silent+=("$repo"); continue ;;
            esac
            python -I "$dir/check_facts.py" --file "$work/facts.json" --repo "$repo" \
              --schema "$dir/facts.schema.json" --version "$dir/facts.version" "${manifest[@]}"
            case $? in
              0) ;;
              1) off+=("$repo") ;;
              *) broken+=("$repo") ;;
            esac
          done
          # Зелёными считаются только объявленные коды (068).
          if [ ${#off[@]} -gt 0 ]; then
            mapfile -t off < <(printf '%s\n' "${off[@]}" | sort -u)
            echo "::warning::Факты расходятся с договором у: ${off[*]} — перечень выше; на витрине у них «—» по недостающему, чинит издатель."
          fi
          if [ ${#silent[@]} -gt 0 ] || [ ${#broken[@]} -gt 0 ]; then
            echo "::error::Сверка фактов не отработала: площадка не ответила по — ${silent[*]:-никому}; проверка отказала — ${broken[*]:-ни у кого} (третий исход, 039)"
            exit 1
          fi
          [ ${#off[@]} -eq 0 ] && echo "все соседи отвечают договору фактов $FACTS_CONTRACT"
          exit 0
