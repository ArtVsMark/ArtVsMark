# Сливает готовые PR витрины сообщением, собранным заново.
#
# Почему не штатный auto-merge GitHub: он сливает своим сообщением, а правило
# 123 требует пересобирать его при слиянии — иначе в первопредках `main` не
# остаётся ни соавторства, ни ссылки на сессию. Скрипт собирает заголовок,
# перечень работ и трейлеры сам.
#
# ПОЧЕМУ НУЖЕН ОТДЕЛЬНЫЙ ТОКЕН. Слияние штатным `GITHUB_TOKEN` делает автором
# коммита `github-actions[bot]` — то есть чинит одну дыру в атрибуции, пробивая
# другую. Автор должен быть человеком, поэтому нужен PAT владельца в секрете
# `MERGE_TOKEN`. Пока секрета нет, прогон честно сообщает об этом и выходит: он
# не притворяется сработавшим.
#
# Стоп-кран — метка `hold` на PR: с ней слияние пропускается.
name: Merge when green

on:
  schedule:
    # Не в 0 и не в 30: в эти минуты GitHub обслуживает расписания всей планеты.
    - cron: "13,43 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: merge-when-green
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MERGE_TOKEN: ${{ secrets.MERGE_TOKEN }}
    steps:
      - name: Забрать витрину
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Слить всё зелёное
        run: |
          set -euo pipefail
          if [ -z "${MERGE_TOKEN}" ]; then
            echo "::warning::Секрета MERGE_TOKEN нет — слияние пропущено."
            echo "Без него автором коммита слияния стал бы github-actions[bot],"
            echo "а атрибуция чинится ровно ради обратного."
            exit 0
          fi
          GH_TOKEN="${MERGE_TOKEN}" python scripts/merge_pr.py --when-green
