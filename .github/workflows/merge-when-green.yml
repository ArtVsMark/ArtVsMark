# Сливает готовые PR витрины сообщением, собранным заново.
#
# Почему не штатный auto-merge GitHub: он сливает своим сообщением, а правило
# 123 требует пересобирать его при слиянии — иначе в первопредках `main` не
# остаётся ни соавторства, ни ссылки на сессию. Скрипт собирает заголовок,
# перечень работ и трейлеры сам.
#
# ПОЧЕМУ НУЖЕН ОТДЕЛЬНЫЙ ТОКЕН. Слияние штатным `GITHUB_TOKEN` делает автором
# коммита `github-actions[bot]` — то есть чинит одну дыру в атрибуции, пробивая
# другую. Автор должен быть человеком, поэтому нужен PAT владельца.
#
# ПОЧЕМУ ИМЯ ОБЩЕЕ. Секрет зовётся `MERGE_QUEUE_TOKEN` — так же, как в грейдере
# и в каталоге правил. Витрина сначала завела своё имя `MERGE_TOKEN`, и это
# стоило простоя: PAT был проставлен во все репозитории разом, а здесь читалось
# другое имя, поэтому автомерж молчал, показывая пустой токен. Одна сущность —
# одно имя во всех проектах владельца.
#
# ПОЧЕМУ ЖАЛОБА НЕ НА КАЖДОМ ПРОГОНЕ. Скрипт читает штатным токеном и молчит,
# пока сливать нечего; про отсутствие токена он говорит в тот момент,
# когда зелёный PR действительно нашёлся. Предупреждение, повторяемое впустую,
# перестают читать.
#
# Стоп-кран — метка `hold` на PR: с ней слияние пропускается. Ничего включать
# на PR не надо: автомерж здесь по умолчанию, отключается меткой, а не
# включается ею. Обратный порядок — «включи, если хочешь» — на практике
# означает «у трёх PR из восьми включено, остальные стоят зелёными».
#
# Черновик тоже пропускается: это второй способ сказать «не сливать», и он
# честнее метки, потому что виден в списке PR.
name: Merge when green

on:
  # Сразу после проверки, а не когда-нибудь: «по умолчанию» должно означать
  # «уедет, как только позеленеет», иначе зелёный PR стоит до часа впустую.
  workflow_run:
    workflows: ["PR check"]
    types: [completed]
  schedule:
    # Не в 0 и не в 30: в эти минуты GitHub обслуживает расписания всей планеты.
    - cron: "43 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: merge-when-green
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # По событию — только за зелёной проверкой; по расписанию и вручную — всегда.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Забрать витрину
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Слить всё зелёное
        env:
          # Читает — штатным, пишет — только этим. Пусто, значит слияния не
          # будет, и скрипт скажет об этом, когда найдёт что сливать.
          GH_TOKEN: ${{ secrets.MERGE_QUEUE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/merge_pr.py --when-green
